apply plugin: 'com.android.application'

// ── 버전 ─────────────────────────────────────────────────────────────────────
// 네이티브 변경(android/**·capacitor.config.ts·AndroidManifest·Gradle 설정·@capacitor/* 플러그인 추가·버전 변경) 중
// 하나라도 있으면 versionCode 를 1 올리고 versionName 도 올린다 — 웹 배포로는 반영되지 않으므로 APK 재빌드·사용자 재설치가 따른다.
// 같은 versionName 으로 다른 내용의 APK 를 내면 scripts/build-apk.sh --publish 가 거부한다.
// 서버 `app_release.version_code`·`/api/app/version`(업데이트 띠) 과 같은 수다 — 정수 비교라 줄어들면 안 된다.
// versionName 은 정확히 x.y.z(각 1~4자리, build-apk.sh·app_release CHECK 와 같은 형식) — 올릴 때마다 이전 값과 달라야 한다(예: 1.0.0 → 1.0.1).
// 이력: 1 = 1.0.0 — T-084 M1 첫 셸(쿠키 flush·키보드 인셋·다운로드 처리)
//       2 = 1.0.1 — T-088 Google 로그인 복귀 딥링크(AndroidManifest intent-filter stockinvest://auth/callback)
//       3 = 1.1.0 — T-091 M2 App Links(AndroidManifest https intent-filter autoVerify — 사이트 루트 `/` 한 경로만)
def stockVersionCode = 3 // 1.1.0 — T-091 M2
def stockVersionName = "1.1.0"

// ── 서명 ─────────────────────────────────────────────────────────────────────
// Play 스토어 없이 사이드로드한다. **StockInvest 전용 release 키스토어**로 서명한다(절차서 D-5 — 실매매 앱이라
// 공개 기본 비밀번호인 디버그 키스토어를 쓰지 않는다. TheKaiwa 와 다른 점).
// 값은 환경변수로만 받는다 — scripts/build-apk.sh 가 ~/.android/stockinvest-signing.env(권한 600, 저장소 밖)를 읽어 넘긴다.
//   STOCKINVEST_KEYSTORE           키스토어 경로(기본 위치 ~/.android/stockinvest-release.keystore)
//   STOCKINVEST_KEYSTORE_PASSWORD  키스토어 비밀번호
//   STOCKINVEST_KEY_ALIAS          키 별칭
//   STOCKINVEST_KEY_PASSWORD       (선택) 키 비밀번호 — 없으면 키스토어 비밀번호(PKCS12 는 둘이 같다)
// **디버그 키스토어로 폴백하지 않는다** — 값이 없거나 디버그 키를 가리키면 release 빌드를 실패시킨다(아래 taskGraph 검사).
// 이 키를 잃으면 기존 설치본 위에 덮어쓰기가 거부돼 앱을 지우고 다시 깔아야 하고(M2 App Links 지문도 바뀐다),
// 새면 같은 서명의 위조 업데이트가 가능하다 → 키스토어·비밀번호는 커밋 금지, 백업 위치는 T-084 task 기록.
def signingEnv = { String key ->
    def v = System.getenv(key)
    return (v == null || v.trim().isEmpty()) ? null : v.trim()
}
def releaseKeystorePath = signingEnv('STOCKINVEST_KEYSTORE')
def releaseKeystorePassword = signingEnv('STOCKINVEST_KEYSTORE_PASSWORD')
def releaseKeyAlias = signingEnv('STOCKINVEST_KEY_ALIAS')
def releaseKeyPassword = signingEnv('STOCKINVEST_KEY_PASSWORD') ?: releaseKeystorePassword

android {
    namespace "com.miraclepenguin.stockinvest"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.miraclepenguin.stockinvest"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode stockVersionCode
        versionName stockVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
        // 대상 기기는 갤럭시 S25+(arm64) 하나다(절차서 D-7). 지금은 네이티브 .so 가 없어 크기 차이는 없다.
        ndk {
            abiFilters 'arm64-v8a'
        }
    }
    signingConfigs {
        release {
            if (releaseKeystorePath != null) {
                storeFile file(releaseKeystorePath)
            }
            storePassword releaseKeystorePassword
            keyAlias releaseKeyAlias
            keyPassword releaseKeyPassword
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            debuggable false
            // WebView 셸이다 — R8 이득(수백 KB)보다 플러그인 리플렉션이 깨질 위험이 크다(TheKaiwa 와 같음).
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

// release 작업이 그래프에 있을 때만 서명 값을 검사한다(clean·debug 빌드는 막지 않는다). 값은 출력하지 않는다.
gradle.taskGraph.whenReady { graph ->
    def wantsRelease = graph.allTasks.any { t -> t.project == project && t.name.toLowerCase().contains('release') }
    if (!wantsRelease) {
        return
    }
    def missing = []
    if (releaseKeystorePath == null) missing << 'STOCKINVEST_KEYSTORE'
    if (releaseKeystorePassword == null) missing << 'STOCKINVEST_KEYSTORE_PASSWORD'
    if (releaseKeyAlias == null) missing << 'STOCKINVEST_KEY_ALIAS'
    if (!missing.isEmpty()) {
        throw new GradleException("release 서명 환경변수 없음: ${missing.join(', ')} — scripts/build-apk.sh 로 빌드한다(디버그 키 폴백 없음)")
    }
    def ks = file(releaseKeystorePath)
    if (!ks.isFile()) {
        throw new GradleException("release 키스토어 파일이 없다(STOCKINVEST_KEYSTORE) — 디버그 키로 대신 서명하지 않는다")
    }
    if (ks.name == 'debug.keystore' || releaseKeyAlias == 'androiddebugkey') {
        throw new GradleException("release 를 디버그 키로 서명하려 했다 — StockInvest 전용 키스토어만 쓴다(절차서 D-5)")
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
