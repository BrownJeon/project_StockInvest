## 데모 검토 게이트 — 2026-09-28 편입 (ADP-001 D-09)

절차 정본: 워크스페이스 `docs/demo-review-gate.md`. 이 프로젝트의 \"목업 → 합의 → 인계\"는 이 게이트로 구체화된다(충돌 시 이 절이 우선).

- **파일**: `mockups/<task-id>-<slug>-v<N>.html` — 한 파일 HTML, 인라인 CSS·JS 만. 한 번 검토에 올린 버전은 **절대 수정하지 않는다**. 수정 요청은 vN+1 새 파일로 만든다.
- **필수 메타**: `<meta name=\"demo-version\" content=\"<task-id>-v<N>\">`, `<meta name=\"demo-token-source\" content=\"src/app/globals.css@sha256:<앞 12자>\">`. 토큰 **값**을 `src/app/globals.css` 에서 복사해 `<style>` 에 고정한다(원본 CSS 링크 금지).
- **완성 확인**: `node ../.claude/tools/demo-gate/check.mjs lint --file mockups/<파일> --expect <task-id>-v<N>` 가 `DEMO_LINT_PASSED` 여야 Leader 에게 넘긴다. Artifact 게시·검토 요청·승인 기록은 Leader 가 한다.
- **수준별 산출물** (judge `demo.level`):
  - full: 정상·빈·로딩·오류 상태 전부, 권한 제한 상태(있으면), 클릭 가능한 주요 흐름, 현재 화면이 있으면 \"현재 vs 제안\" 비교, 결정 필요 A/B, 기기 폭 대표 412px(갤럭시 S25+ 크롬), 경계 360·412px, ≥900px 데스크톱 복원은 1280px 로 함께 확인
  - delta: 바뀌는 영역과 주변 문맥, 영향을 받는 상태만, \"현재 vs 제안\" 비교, 필요한 A/B 만, 대표 폭
  - 삭제·결제·권한 같은 고위험 CTA 는 범위가 작아도 성공·실패·취소·확인 상태를 넣는다
- **결정 필요 A/B**: Leader 에게 \"확인 요청\"으로 넘길 결정거리는 대화로 묻지 말고 데모 안 \"결정 필요\" 패널에 A/B 로 나란히 놓는다.
- **보안**: 외부 URL·CDN·원격 폰트·외부 이미지·`fetch`·`action` 있는 `<form>`·분석 스크립트 금지. 실제 개인정보·운영 데이터 금지 — 합성 샘플 데이터(이메일은 example.com)와 저장소 내부 자산만.
- **구현 가이드**: 첫 줄에 `승인 데모: mockups/<파일> (vN)` 를 적고, 적용할 실제 토큰 **이름**을 나열한다. 승인(또는 사용자 생략) 전에는 developer 에게 가이드를 넘기지 않는다.
- **신규 프로젝트 기준 데모**(첫 화면 작업 전): 앱·관리자 셸, 내비게이션 구조, 대표 목록 1개, 대표 상세·폼 1개, 핵심 토큰, 공통 로딩·빈·오류 컴포넌트, 대표 반응형 기준. 모든 화면을 미리 만들지 않는다.

## 디자인 스킬 적용 — 2026-10-04

정본: 워크스페이스 `docs/design-skills.md`. 스킬 파일은 `../.agents/skills/<이름>/SKILL.md`(프로젝트 루트 기준)이다. 이 역할은 general-purpose 로도 호출되므로 **단계마다 해당 파일을 Read 해서** 적용한다.

- **`project-ui-system` 프로필**: **부분** — 원칙(상태 가시성·색만으로 상태 표현 금지·간격 스케일·표 우선·상태 목록)만, 레이아웃·반응형은 모바일 우선(412px) 기준
- ① 설계(judge full, 또는 delta 중 레이아웃·정보 구조 변경): `page-layout-designer` → 구현 가이드 앞에 \"레이아웃 설계\" 절(목표·주요 위계·영역·컴포넌트·상태·행동·반응형)
- ② 데모·컴포넌트 분해: `ui-component-builder` (+ 프로필이 적용·부분인 화면이면 `project-ui-system`)
