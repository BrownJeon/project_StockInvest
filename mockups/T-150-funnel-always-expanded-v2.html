<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="demo-version" content="T-150-v2"><meta name="demo-token-source" content="src/app/globals.css@sha256:04e7b5bc8394"><title>T-150 평가 깔때기 상시 펼침 데모</title>
<style>
:root{--bg:#0f1115;--bg2:#171a21;--bg3:#1f2430;--border:#262b36;--text:#e6e8ee;--muted:#8b93a7;--accent:#f59e0b;--ok:#22c55e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,sans-serif}main{max-width:900px;margin:auto;padding:16px}h1{font-size:20px}h2{font-size:16px}p{color:var(--muted)}.grid{display:grid;gap:16px}.phone{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:14px;max-width:412px}.seg{display:flex;gap:8px;margin:12px 0}.seg button{flex:1;min-height:44px;background:var(--bg3);color:var(--text);border:1px solid var(--border);border-radius:8px;font:inherit}.seg button[aria-pressed=true]{border-color:var(--accent);color:var(--text)}button:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}.box{background:var(--bg);border:1px solid var(--border);border-radius:8px}.box h3,summary{margin:0;padding:12px 14px;font-size:13px;color:var(--muted)}summary{cursor:pointer;min-height:44px}.info{padding:2px 14px 10px}.rows{padding:4px 14px 12px}.row{display:grid;grid-template-columns:86px minmax(0,1fr) 70px;align-items:center;gap:8px;margin:6px 0;font-size:12px}.row b{text-align:right;font-variant-numeric:tabular-nums}.bar{height:14px;background:var(--bg3);border-radius:4px;overflow:hidden}.bar i{display:block;background:var(--accent);height:100%;opacity:.8}.anomaly{margin-top:6px;padding:6px 10px;border-radius:8px;background:rgba(239,68,68,.12);color:#f87171;font-size:12px}.bottleneck{margin-top:6px;color:var(--muted);font-size:12px}.rank{padding:0 14px 12px;color:var(--muted);font-size:12px}.note{font-size:12px;color:var(--muted)}@media(min-width:900px){.grid{grid-template-columns:1fr 1fr}}
</style></head><body><main><h1>운영 기록 · 평가 깔때기</h1><p>비교 데모 · 숫자와 날짜는 모두 합성 예시입니다. 국내·해외를 선택해 확인하세요.</p><div class="grid"><section class="phone" aria-labelledby="before"><h2 id="before">현재 · 상세 접힘</h2><p class="note">평가 깔때기를 눌러 상세를 열고 닫습니다.</p><div class="seg" aria-label="현재 시장"><button type="button" data-market="domestic" aria-pressed="true">국내 · 11-03</button><button type="button" data-market="overseas" aria-pressed="false">해외 · 11-03</button></div><div class="box"><details><summary>평가 깔때기 <span aria-hidden="true">▾</span><span class="info count" style="display:block;padding:6px 0 0;color:var(--text)"></span></summary><div class="detail"></div></details></div></section><section class="phone" aria-labelledby="after"><h2 id="after">변경 · 상세 항상 표시</h2><p class="note">국내·해외 모두 상세가 보이며 접기 버튼이 없습니다.</p><div class="seg" aria-label="변경 시장"><button type="button" data-market="domestic" aria-pressed="true">국내 · 11-03</button><button type="button" data-market="overseas" aria-pressed="false">해외 · 11-03</button></div><div class="box"><h3>평가 깔때기</h3><div class="info count"></div><div class="detail"></div></div></section></div><p>주문 기록은 깔때기 아래에 이어집니다. 이 데모는 화면 표시만 보여줍니다.</p></main><script>
const examples={domestic:{runs:57,signals:1,values:[44,32,22,8,2,1],blocked:12,anomaly:false},overseas:{runs:61,signals:2,values:[51,38,24,9,4,2],blocked:13,anomaly:true}};
const names=['종목평가','룰 발화','가드 통과','프리필터 통과','안전게이트 통과','전략시그널'];
function render(section,market){const d=examples[market];const pct=Math.round(d.blocked/d.values[0]*100);section.querySelector('.count').innerHTML=`시그널 <strong>${d.signals}건</strong> <span style="color:var(--muted)">(전략 ${d.signals} · 청산 0) · 런 ${d.runs}회</span>${d.anomaly?'<div class="anomaly">⚠ 이상: AI 배치 실패 1회</div>':''}<div class="bottleneck">병목: <strong style="color:var(--text)">룰 미발화</strong> ${d.blocked}/${d.values[0]}종목 (-${pct}%)</div>`;section.querySelector('.detail').innerHTML='<div class="rows">'+d.values.map((n,i)=>`<div class="row"><span>${names[i]}</span><span class="bar" aria-hidden="true"><i style="width:${Math.round(n/d.values[0]*100)}%"></i></span><b>${n}${i?` (${Math.round(n/d.values[i-1]*100)}%)`:''}</b></div>`).join('')+`</div><div class="rank">최다 차단<div style="display:flex;justify-content:space-between;padding:3px 0"><span>1위 룰 미발화</span><span>${d.blocked}건</span></div></div>`;}
document.querySelectorAll('.phone').forEach(section=>{render(section,'domestic');section.querySelectorAll('[data-market]').forEach(button=>button.addEventListener('click',()=>{section.querySelectorAll('[data-market]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));render(section,button.dataset.market)}))});
</script></body></html>
