<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'"><meta name="demo-version" content="T-156-v6"><meta name="demo-token-source" content="src/app/globals.css@sha256:04e7b5bc8394"><title>StockInvest · 모의분석 데모 v6</title><style>:root {
  --bg: #0f1115;
  --bg2: #171a21;
  --bg3: #1f2430;
  --bg4: #262b36;
  --border: #262b36;
  --border2: #323848;
  --text: #e6e8ee;
  --muted: #8b93a7;
  --up: #ef4444;    /* 한국 관습: 상승 빨강 */
  --down: #3b82f6;  /* 한국 관습: 하락 파랑 */
  --accent: #f59e0b;
  --ok: #22c55e;
  --warn: #f59e0b;
  --danger: #ef4444;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --nav-h: 60px;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  max-width: 100vw;     /* 자식의 intrinsic 폭 초과 시에도 layout viewport 제한 — 모바일 fit-to-page 줌아웃 차단 */
  overflow-x: clip;     /* 수평 페이지 오버플로우 차단 — sticky 포지셔닝 유지됨 */
}
html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: ui-sans-serif, system-ui, -apple-system, "Noto Sans KR", sans-serif;
  font-size: 14px;
  -webkit-text-size-adjust: 100%;
  overscroll-behavior-y: contain;
}
/* 가로 폭만 viewport에 제한, 세로 스크롤은 막지 않음 */
body { width: 100%; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
a { color: inherit; text-decoration: none; }
.num { font-variant-numeric: tabular-nums; }
.up { color: var(--up); }
.down { color: var(--down); }
@keyframes ti-spin { to { transform: rotate(360deg); } }

/*
 * T-108 운용 화면 공용 스타일 — 승인 데모 v3(mockups/T-108-menu-home-v3.html) 112~235행 「앱 화면」 클래스를 이름 그대로 옮겼다.
 * (데모 문서 틀 .page·.controls·.decide·.phone·.frm·.scrl·.cur 와 비서 화면 .bubble·.qchips·.compose 는 옮기지 않음)
 *
 * - CSS Module 이라 클래스가 이 파일 안에서만 유효하다(전역 .card·.btn·.sec-h 등과 섞이지 않음).
 *   단 .num·.up·.down 은 globals.css 전역 클래스를 그대로 쓴다(컴포넌트가 className 에 같이 붙인다).
 * - 색은 globals.css 토큰 이름만. 리터럴 #fca5a5·#86efac·#2a1416·rgba(…) 는 데모 값 그대로(새 토큰 아님 — 가이드 §2.0).
 * - 데모의 @container app (min-width: 900px) → @media (min-width: 900px) (T-084 선례, 가이드 §0.4).
 * - 데모에 없던 것(가이드 §8.4 재량 — 시각 결과 같음): 포커스 링을 클래스마다 붙임(데모는 전역 :focus-visible),
 *   스피너 keyframes 를 이 모듈 안에 둠(모듈 안 animation 이름은 지역화되므로), .scr 아래 여백 16px(데모 .scrl 몫),
 *   .gate·.res·.btrow 를 시트 밖에서도 쓰게 단독 선택자로(데모는 .sheet 아래), 띠 칩 줄 오른쪽 끝 페이드(.sws.fade — 가이드 §8.2 P2),
 *   foot 안 링크 밑줄·44px(.sec-foot a), 미니 띠 제목(.strip-title — 데모는 인라인 style), a.stage 44px(미니 띠 배지가 링크).
 */

/* ── 안전 상태 띠 (홈·거래 공통, 스크롤해도 보임) ── */
.strip { position: sticky; top: 0; z-index: 6; background: var(--bg2); border-bottom: 1px solid var(--border); padding: 8px 12px 10px; }
.strip-h { display: flex; align-items: center; gap: 8px; min-width: 0; }
.stage { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; padding: 4px 10px; border-radius: 6px; border: 1px solid var(--border2); white-space: nowrap; }
.stage .dot { width: 8px; height: 8px; flex: none; }
a.stage, button.stage { min-height: 44px; flex: none; }
.stage.obs { color: var(--accent); border-color: rgba(245,158,11,.5); }
.stage.obs .dot { background: var(--accent); border-radius: 50%; }
.stage.live { color: #fca5a5; border-color: rgba(239,68,68,.6); background: #2a1416; }
.stage.live .dot { background: var(--danger); border-radius: 1px; transform: rotate(45deg); }
.stage.mixed { color: #fca5a5; border-color: rgba(239,68,68,.6); }
.stage.mixed .dot { background: var(--danger); clip-path: polygon(50% 0, 100% 100%, 0 100%); }
.stage.halt { color: var(--text); border-color: var(--border2); background: var(--bg3); }
.stage.halt .dot { background: var(--muted); border-radius: 1px; }
.stage.err { color: #fca5a5; border-color: var(--danger); }
.stage.err .dot { background: transparent; border: 2px solid var(--danger); border-radius: 50%; }
.strip-sum { font-size: 12px; color: var(--muted); line-height: 1.45; min-width: 0; flex: 1; overflow-wrap: anywhere; word-break: keep-all; }
.strip-sum b { color: var(--text); }
.strip-title { font-size: 15px; font-weight: 700; color: var(--text); }
.strip-go { flex: none; min-width: 44px; min-height: 44px; display: inline-flex; align-items: center; justify-content: center; border-radius: 8px; color: var(--muted); font-size: 12px; font-weight: 600; }
.sws { display: flex; gap: 6px; overflow-x: auto; margin-top: 8px; scrollbar-width: none; }
.sws::-webkit-scrollbar { display: none; }
.sws.fade { -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 28px), transparent); mask-image: linear-gradient(to right, #000 calc(100% - 28px), transparent); }
.sw { flex: none; font-size: 11px; font-weight: 600; padding: 4px 8px; border-radius: 6px; border: 1px solid var(--border2); background: var(--bg3); color: var(--text); white-space: nowrap; line-height: 1.4; }
.sw i { font-style: normal; color: var(--muted); font-weight: 500; margin-right: 4px; }
.sw.bad { border-color: rgba(239,68,68,.6); background: #2a1416; color: #fca5a5; }
.sw.warn { border-color: rgba(245,158,11,.5); color: var(--accent); }
.sw.sep { background: transparent; border-style: dashed; }
.strip-alert { margin-top: 8px; font-size: 12px; line-height: 1.5; color: #fca5a5; background: #2a1416; border: 1px solid rgba(239,68,68,.5); border-left: 3px solid var(--danger); border-radius: 6px; padding: 6px 8px; word-break: keep-all; overflow-wrap: anywhere; }

/* ── 화면 공통 ── */
.scr { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; padding: 8px 0 16px; }
.col { display: grid; gap: 8px; min-width: 0; align-content: start; }
.sec { background: var(--bg2); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); min-width: 0; }
.sec-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 12px 4px 16px; min-height: 44px; }
.sec-h h2 { margin: 0; font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .3px; line-height: 1.4; }
.sec-h h2 small { font-weight: 500; font-size: 11px; margin-left: 4px; }
.lnk { min-height: 44px; min-width: 44px; display: inline-flex; align-items: center; justify-content: flex-end; gap: 2px; font-size: 12px; color: var(--muted); font-weight: 600; white-space: nowrap; padding: 0 4px; }
.sec-b { padding: 0 16px 12px; }
.sec-foot { font-size: 11px; color: var(--muted); padding: 0 16px 10px; line-height: 1.5; }
/* foot 안 링크(계좌 전체 손익 → 자산 기록, 401 → 로그인): 밑줄로 링크임을 보이고(색만 쓰지 않음) 터치 44px */
.sec-foot a { text-decoration: underline; display: inline-flex; align-items: center; min-height: 44px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; background: var(--border); border-top: 1px solid var(--border); }
.tile { background: var(--bg2); padding: 10px 12px; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.tile.wide { grid-column: 1 / -1; }
.tile .lb { font-size: 12px; color: var(--muted); line-height: 1.4; word-break: keep-all; }
.tile .v { font-size: 18px; font-weight: 700; line-height: 1.25; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.tile .v small { font-size: 12px; font-weight: 600; color: var(--muted); margin-left: 2px; }
.tile .mk { font-size: 13px; line-height: 1.45; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; word-break: keep-all; }
.tile .mk i { font-style: normal; color: var(--muted); display: inline-block; min-width: 28px; }
.tile .meta { font-size: 11px; color: var(--muted); line-height: 1.45; overflow-wrap: anywhere; word-break: keep-all; }
.tile.dim .v, .tile.dim .mk { color: var(--muted); }
.st { display: inline-flex; align-items: center; gap: 4px; align-self: flex-start; font-size: 11px; font-weight: 700; padding: 2px 6px; border-radius: 6px; border: 1px solid var(--border2); color: var(--text); background: var(--bg); line-height: 1.4; white-space: normal; overflow-wrap: anywhere; word-break: keep-all; }
/* T-130 D4-A — 분석 › 데이터 상태에서만 한국어 칩 뒤에 붙는 영문 원인 코드 */
.stCode { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; font-weight: 600; margin-left: 4px; }
.st.zero { border-color: rgba(34,197,94,.5); color: #86efac; }
.st.unknown { border-style: dashed; color: var(--muted); }
.st.error { border-color: var(--danger); color: #fca5a5; }
.st.stale { border-style: dotted; border-color: var(--muted); color: var(--muted); }
.st.partial { border-color: rgba(245,158,11,.5); color: var(--accent); }
.st.blocked { border-color: rgba(239,68,68,.6); color: #fca5a5; background: #2a1416; }
.st.off { color: var(--muted); }
.st.prep { border-style: dashed; border-color: var(--muted); color: var(--muted); }
.retry { min-height: 44px; align-self: flex-start; padding: 0 12px; border-radius: 8px; border: 1px solid var(--border2); background: var(--bg3); font-size: 12px; font-weight: 600; }
.skel { display: block; height: 14px; border-radius: 4px; background: var(--bg3); }
.skel.big { height: 22px; width: 60%; }
.skel.w80 { width: 80%; }
.skel.w50 { width: 50%; }
.rows { border-top: 1px solid var(--border); }
.rowl { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; min-height: 56px; padding: 8px 12px 8px 16px; border-bottom: 1px solid var(--border); width: 100%; text-align: left; }
.rowl:last-child { border-bottom: 0; }
.rowl .ic { width: 22px; height: 22px; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; border-radius: 6px; border: 1px solid var(--border2); color: var(--muted); }
.rowl .ic.e { border-color: var(--danger); color: #fca5a5; }
.rowl .ic.w { border-color: rgba(245,158,11,.6); color: var(--accent); }
.rowl .ic.i { color: var(--text); }
.rowl .t, .rowl .s { display: block; }
.rowl .t { font-size: 13px; font-weight: 600; line-height: 1.4; overflow-wrap: anywhere; word-break: keep-all; }
.rowl .s { font-size: 12px; color: var(--muted); line-height: 1.45; overflow-wrap: anywhere; word-break: keep-all; margin-top: 2px; }
.rowl .r { font-size: 12px; color: var(--muted); white-space: nowrap; text-align: right; font-variant-numeric: tabular-nums; }
.empty { padding: 14px 16px; font-size: 13px; color: var(--muted); line-height: 1.55; border-top: 1px solid var(--border); word-break: keep-all; }
.empty b { color: var(--text); }
.lines { border-top: 1px solid var(--border); }
.ln { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 8px; padding: 9px 16px; border-bottom: 1px solid var(--border); font-size: 13px; line-height: 1.5; align-items: start; }
.ln:last-child { border-bottom: 0; }
.ln .k { font-size: 12px; color: var(--muted); font-weight: 600; padding-top: 1px; }
.ln .d { overflow-wrap: anywhere; word-break: keep-all; min-width: 0; }
.ln .d .m { display: block; font-size: 11px; color: var(--muted); margin-top: 2px; }
.mt { width: 100%; border-collapse: collapse; font-size: 13px; border-top: 1px solid var(--border); }
.mt caption { caption-side: bottom; text-align: left; font-size: 11px; color: var(--muted); padding: 6px 16px 10px; line-height: 1.5; }
.mt th, .mt td { padding: 7px 8px; border-bottom: 1px solid var(--border); text-align: right; font-variant-numeric: tabular-nums; vertical-align: top; }
.mt th:first-child, .mt td:first-child { text-align: left; padding-left: 16px; color: var(--muted); font-weight: 600; font-size: 12px; }
.mt thead th { font-size: 12px; color: var(--muted); font-weight: 600; background: var(--bg2); }
.mt thead th small { display: block; font-weight: 500; font-size: 11px; }
.mt td.dim { color: var(--muted); }
.act { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 8px; padding: 8px 16px; border-bottom: 1px solid var(--border); font-size: 13px; line-height: 1.5; }
.act:last-child { border-bottom: 0; }
.act .tm { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; padding-top: 1px; }
.act .s { display: block; font-size: 12px; color: var(--muted); }
.seg2 { display: flex; gap: 4px; background: var(--bg3); padding: 3px; border-radius: 8px; }
.seg2 button { flex: 1 1 0; min-height: 44px; padding: 0 8px; border-radius: 6px; font-size: 12px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.seg2 button[aria-pressed="true"] { background: var(--bg4); color: var(--text); box-shadow: inset 0 -2px 0 var(--accent); }
.subnav { position: sticky; top: var(--strip-h, 0px); z-index: 5; background: var(--bg); padding: 8px 12px; border-bottom: 1px solid var(--border); }
.btn { min-height: 44px; padding: 0 14px; border-radius: 8px; font-size: 13px; font-weight: 700; border: 1px solid var(--border2); background: var(--bg3); display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.btn.pri { background: var(--accent); color: #221a05; border-color: var(--accent); }
.btn.dz { background: #2a1416; color: #fca5a5; border-color: rgba(239,68,68,.6); }
.btn[disabled] { opacity: .55; cursor: not-allowed; }
.btn .d { font-size: 11px; font-weight: 600; opacity: .85; }
.card { margin: 0 12px 8px; background: var(--bg3); border: 1px solid var(--border2); border-radius: 8px; padding: 10px 12px; font-size: 13px; line-height: 1.5; }
.card .h { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-weight: 700; }
.card .s { font-size: 12px; color: var(--muted); margin-top: 2px; overflow-wrap: anywhere; word-break: keep-all; }
.card .bt { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
.pill { font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 6px; border: 1px solid var(--border2); color: var(--muted); }
.pill.buy { color: #fca5a5; border-color: rgba(239,68,68,.5); }
.pill.sell { color: #93c5fd; border-color: rgba(59,130,246,.5); }
.kv { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; padding: 10px 16px; border-bottom: 1px solid var(--border); font-size: 13px; align-items: center; min-height: 52px; }
.kv:last-child { border-bottom: 0; }
.kv .s { grid-column: 1 / -1; font-size: 11px; color: var(--muted); line-height: 1.5; }
.bar { height: 6px; border-radius: 3px; background: var(--bg4); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--muted); }

/* 승인 안내·결과(데모 .sheet .gate / .sheet .res — 시트 밖 ScenarioDetail 에서도 쓰게 단독 선택자) */
.gate { margin: 10px 0; padding: 8px 10px; border-radius: 8px; border: 1px solid rgba(245,158,11,.5); background: rgba(245,158,11,.06); font-size: 12px; line-height: 1.55; word-break: keep-all; }
.gate.bad { border-color: rgba(239,68,68,.6); background: #2a1416; color: #fca5a5; }
.res { margin: 10px 0 0; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border2); font-size: 12px; line-height: 1.55; word-break: keep-all; }
.res.ok { border-color: rgba(34,197,94,.5); color: #86efac; }
.res.e { border-color: var(--danger); color: #fca5a5; }
.btrow { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
.btrow .full { grid-column: 1 / -1; }

/* 스피너 — globals.css 의 ti-spin 과 같은 모양을 이 모듈 안에 둔다(모듈 안 animation 이름은 지역화된다) */
@keyframes spin { to { transform: rotate(360deg); } }
.spin { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--border2); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; flex: none; }
@media (prefers-reduced-motion: reduce) { .spin { animation: none; } }

/* 화면 읽기 전용 글자(보이지 않음) */
.sr { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

/* 포커스 링(데모 전역 :focus-visible 을 클래스마다) */
.lnk:focus-visible, .rowl:focus-visible, .retry:focus-visible, .strip-go:focus-visible, .stage:focus-visible,
.seg2 button:focus-visible, .btn:focus-visible, .sec-foot a:focus-visible, .res:focus-visible {
  outline: 2px solid var(--text); outline-offset: 2px; border-radius: 4px;
}

/* ── 데스크톱 복원 (≥900px) ── */
@media (min-width: 900px) {
  .scr { grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 12px; padding: 12px 16px 16px; }
  .scr.one { grid-template-columns: minmax(0, 760px); justify-content: center; }
  .sec { border: 1px solid var(--border); border-radius: 10px; }
  .strip { padding: 10px 24px; }
  .subnav { padding: 8px 16px; }
  .subnav .seg2 { max-width: 520px; }
}


.bn { position: fixed; left: 0; right: 0; bottom: 0; height: calc(var(--nav-h) + var(--safe-bottom)); padding-bottom: var(--safe-bottom); background: var(--bg2); border-top: 1px solid var(--border); display: grid; grid-template-columns: repeat(5, 1fr); z-index: 20; }
.bn a { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 56px; color: var(--muted); font-size: 11px; font-weight: 600; line-height: 1.2; }
.bn a svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.bn a[aria-current="page"] { color: var(--accent); }
.bn .bar { position: absolute; top: 0; left: 30%; right: 30%; height: 2px; background: var(--accent); border-radius: 0 0 2px 2px; }
.bn a:focus-visible { outline: 2px solid var(--text); outline-offset: -2px; border-radius: 4px; }
@media (min-width: 900px) {
  .bn { left: 50%; right: auto; width: 720px; transform: translateX(-50%); border: 1px solid var(--border); border-bottom: 0; border-radius: 14px 14px 0 0; }
}

/* 데모 도구는 앱 화면 밖. 앱의 globals/ops/BottomTabs CSS 스냅샷은 위 그대로. */

const ASOF='2026-11-06',T0='2026-08-31',ACCOUNT_START='2026-09-01';
const dayMs=86400000;
function addDay(d,n){return new Date(Date.parse(d+'T12:00:00Z')+n*dayMs).toISOString().slice(0,10)}
function weekdayDays(a,b){const out=[];for(let d=a;d<=b;d=addDay(d,1)){const w=new Date(d+'T12:00:00Z').getUTCDay();if(w!==0&&w!==6)out.push(d)}return out}
const calendar=weekdayDays(ACCOUNT_START,ASOF);
const equitySeries=calendar.map((date,i)=>({date,equity:12000+(i+1)*7-(i%7===3?35:0),i:i+1}));
const signalSeries=Array.from({length:23},(_,i)=>{const ix=Math.floor(i*(calendar.length-1)/22),entryIx=ix+1,closed=i%3===0&&entryIx+5<calendar.length;return {i:i+1,side:i%2?'sell':'buy',symbol:'DEMO-'+String(i%5+1).padStart(2,'0'),generated:calendar[ix],entry:calendar[entryIx]||null,end:closed?calendar[entryIx+5]:ASOF,status:closed?'추적 종료':entryIx<calendar.length?'추적중':'집행 대기'}});
const periodOptions={week:[['2026-11-02','2026.11.02–11.08 · 1주'],['2026-10-26','2026.10.26–11.01 · 1주'],['2026-09-28','2026.09.28–10.04 · 1주'],['2025-12-29','2025.12.29–2026.01.04 · 1주']],month:[['2026-11','2026.11 · 1개월'],['2026-10','2026.10 · 1개월'],['2026-09','2026.09 · 1개월'],['2026-01','2026.01 · 1개월'],['2025-12','2025.12 · 1개월']]};
function range(){if(periodKind==='all')return {start:ACCOUNT_START,end:ASOF,title:'전체 모의계좌 기간',duration:'67일'};if(periodKind==='week'){const start=periodKey||periodOptions.week[0][0];return {start,end:addDay(start,6),title:'주간 '+start.replaceAll('-','.'),duration:'1주'}}const key=periodKey||periodOptions.month[0][0],start=key+'-01';const next=new Date(start+'T12:00:00Z');next.setUTCMonth(next.getUTCMonth()+1);return {start,end:addDay(next.toISOString().slice(0,10),-1),title:'월간 '+key.replace('-','.'),duration:'1개월'}}
function series(){let a=equitySeries;if(countMode!=='normal'&&countMode!=='stress')a=a.slice(0,Number(countMode));const r=range(),inside=a.filter(p=>p.date>=r.start&&p.date<=r.end),outside=a.filter(p=>p.date<r.start||p.date>r.end);if(integrity==='unobserved')return outside;if(integrity==='one')return [...outside,...inside.slice(0,1)].sort((a,b)=>a.date.localeCompare(b.date));if(integrity==='gap'){const omitted=inside[Math.floor(inside.length/2)]?.date;return a.filter(p=>p.date!==omitted)}return a}
function periodData(){const r=range(),cutoff=r.end<ASOF?r.end:ASOF,expected=weekdayDays(r.start,cutoff).filter(d=>d>=ACCOUNT_START),points=series().filter(p=>p.date>=r.start&&p.date<=cutoff);const baselineDate= r.start===ACCOUNT_START?T0:weekdayDays(ACCOUNT_START,addDay(r.start,-1)).at(-1);let baseline=baselineDate===T0?{date:T0,equity:12000}:series().find(p=>p.date===baselineDate);if(integrity==='baseline')baseline=null;const last=points.at(-1),complete=points.length===expected.length&&points.length>1&&baseline&&integrity!=='truncated';let result=null;if(complete){let peak=baseline.equity,mdd=0;for(const p of points){peak=Math.max(peak,p.equity);mdd=Math.min(mdd,(p.equity/peak-1)*100)}result={ret:(last.equity/baseline.equity-1)*100,pnl:last.equity-baseline.equity,mdd}}return {r,cutoff,expected,points,baseline,last,result,partial:r.end>ASOF,days:Math.max(0,Math.round((Date.parse(cutoff)-Date.parse(r.start))/dayMs)+1)}}

function record(r){if(active==='signals'){const expected=r.entry?weekdayDays(r.entry,r.end):[],observed=expected.filter(date=>series().some(p=>p.date===date)),n=observed.length;return '<article class="judgment"><div class="judgment-head"><b>'+r.symbol+' · 기록 '+r.i+' · 모의 '+(r.side==='buy'?'매수':'매도')+'</b><span class="st">'+r.status+'</span></div><p>생성 '+r.generated+' 장마감 (ET)<br>모형 집행 '+(r.entry?r.entry+' 개장 (ET)':'없음 · 다음 개장 대기')+'</p><p>추적 관측 '+(r.entry?(n?observed[0]+'–'+observed.at(-1):'아직 없음')+' · 관측 '+n+' / 예상 '+expected.length+'거래일':'아직 없음 · 0거래일')+'</p><p>개별 시그널 손익 집계 연결 전</p><details><summary>모의 기록과 추적 범위</summary><p>생성기간으로 목록을 고릅니다. 추적은 모형 집행 뒤 추적 종료 또는 조회 기준일까지 이어져 선택기간 밖일 수 있습니다. 추적 종료는 포지션 청산·실현손익 확정이 아니며 종료 비율은 매매 승률이 아닙니다.</p><p>모의 매수/매도 후속 관측 예시 · 적용 '+(scenario==='current'?'M40 기본 rev.1':'설계예시 결합 rev.2')+' · 실제 체결 아님</p></details></article>'}if(active==='performance')return '<article class="judgment"><b>'+r.date+' 장마감 (ET)</b><p>모의계좌 평가액 <span class="num">'+usd(r.equity)+'</span> · 기존 보유 포함</p></article>';return originalRecord(r)}
function metrics(){const d=periodData();return '<div class="metrics-intro"><b>선택기간 모의계좌성과 (기존 보유 포함)</b><p>'+(d.result?(d.partial?'부분기간 성과 · 기준일까지 관측 완전':'선택기간 관측 완전'):'성과 미확인 · '+(!d.baseline?'직전 기준평가 없음':d.points.length<=1?'관측 0–1점':integrity==='truncated'?'이력 잘림':'필요 관측 누락'))+'</p><p>실제 평가관측: '+(d.points.length?d.points[0].date+'–'+d.last.date+' · '+d.points.length+'합성거래일'+(d.points.length<d.expected.length?' · 관측 누락/부족':''):'없음 · 미확인')+'</p><p>수익률 기준: '+(d.baseline?d.baseline.date+' 장마감 · '+usd(d.baseline.equity):'미확인')+'<br>마지막 평가: '+(d.last?d.last.date+' 장마감 · '+usd(d.last.equity):'아직 없음')+'</p></div><div class="metric-list">'+[['기간 수익률',pct(d.result?.ret)],['기간 평가손익',usd(d.result?.pnl)],['같은 기간 최대 낙폭',pct(d.result?.mdd)],['연환산 수익률 (CAGR)','아직 없음']].map(([a,b])=>'<div class="tile"><span class="lb">'+a+'</span><span class="v">'+b+'</span></div>').join('')+'</div><p class="hint">원래 시작 투자금 '+usd(12000)+' · T0 '+T0+' 고정. 기간 시작 평가액과 다릅니다. 기간 변경은 보유 규칙·T0를 바꾸지 않습니다.</p><details style="padding:0 16px"><summary>성과와 시그널의 차이 · 계산 기준</summary><p>모의계좌 성과에는 이전 기간부터 가진 종목도 포함됩니다. 선택기간에 생성된 시그널만의 손익이 아닙니다. 개별 시그널 손익 집계는 현재 연결 전입니다.</p><p>합성 평가액은 편도 비용 0.25% 차감 후라는 가정이며 외부 입출금은 없습니다. 직전 확인 기준평가부터 마지막 관측까지 동일 창으로 수익률·평가손익·최대 낙폭을 계산합니다. 0–1점·기준평가 없음·과거 공백·이력 잘림이면 미확인입니다. 365일 이상 완전 이력만 CAGR을 계산합니다. 종료되지 않은 보유는 진행중이며 손익 0으로 두지 않습니다. 리허설과 전진성과는 분리합니다.</p></details>'}
function v4Panel(){if(state!=='normal')return originalPanel();if(active!=='signals'&&active!=='performance')return originalPanel();const data=records(),pg=pager(data.length),d=periodData(),signalCount=(()=>{const r=range();return signalSeries.filter(s=>s.generated>=r.start&&s.generated<=r.end&&s.generated<=ASOF)})();return '<section class="sec panel" id="panel-'+active+'" role="tabpanel" aria-labelledby="tab-'+active+'" tabindex="0"><div class="sec-h"><h2>'+labels[active]+'</h2></div>'+periodHeader()+(active==='performance'?metrics():'<p class="hint"><b>시그널 생성 필터: '+d.r.start+'–'+(d.r.end<ASOF?d.r.end:ASOF)+' (ET)</b><br>표시 '+data.length+'개 · 생성일 기준<br>추적 종료 '+data.filter(s=>s.status==='추적 종료').length+' · 추적중 '+data.filter(s=>s.status==='추적중').length+' · 집행 대기 '+data.filter(s=>s.status==='집행 대기').length+'개<br>추적 상태는 개별 기록의 실제 관측 범위로 확인합니다.<br>개별 시그널 손익 집계 연결 전 · 모의계좌 성과와 구별합니다.</p>')+'<div id="records">'+(data.length?data.slice((pages[active]-1)*10,pages[active]*10).map(record).join(''):'<p class="empty">선택기간 기록이 없습니다. 수익 0을 뜻하지 않습니다.</p>')+'</div>'+pg+'<p class="hint">합성 저장 이력 예시 · 모든 날짜는 '+ASOF+' 기준일까지입니다. 목록 페이지는 요약·관측기간·성과를 바꾸지 않습니다.</p></section>'}
function periodChange(e){const t=e.target;if(!['period-kind','period-key','integrity'].includes(t.id))return;if(t.id==='period-kind'){periodKind=t.value;periodKey=''}if(t.id==='period-key')periodKey=t.value;if(t.id==='integrity')integrity=t.value;pages.signals=pages.performance=1;render();el(t.id).focus({preventScroll:true});announce('공통 기간과 관측 조건 변경 · 저장 예시만 표시')}


const HORIZONS={week:'1주',month:'1개월',quarter:'3개월',year:'1년'};
function horizonLabel(h){return HORIZONS[h]||'기간 미확인'}
function addMonthsClamped(d,count){const [y,m,day]=d.split('-').map(Number),last=new Date(Date.UTC(y,m-1+count+1,0)).getUTCDate();return new Date(Date.UTC(y,m-1+count,Math.min(day,last),12)).toISOString().slice(0,10)}
function nextMonthClamped(d){return addMonthsClamped(d,1)}
function forecastWindow(asOf,horizon){const end=horizon==='week'?addDay(asOf,7):addMonthsClamped(asOf,{month:1,quarter:3,year:12}[horizon]),start=addDay(asOf,1),sessions=weekdayDays(start,end);return {start,end,evaluation:sessions.at(-1)||null,sessions}}
const LONG_PATHS={quarter:[[-1900,8100,7400],[-1100,12600,9200],[-580,6800,7300],[-120,17500,14800],[210,9600,10200],[520,13200,11600],[970,7400,8200],[1480,19100,17600],[2350,11400,9800],[3720,16300,14900]],year:[[-4100,29400,25100],[-2700,41700,38200],[-1350,22600,24700],[-460,56800,49200],[340,31500,28600],[1280,44300,39700],[2650,27400,30600],[4210,64900,58300],[6800,38200,34100],[10300,50700,46900]]};
function syntheticPaths(horizon){if(LONG_PATHS[horizon])return LONG_PATHS[horizon].map(([grossPnl,buyNotional,sellNotional],i)=>({id:horizon+'-path-'+(i+1),grossPnl,buyNotional,sellNotional}));const factor=horizon==='month'?2.2:1;return [-420,-260,-150,-60,30,110,190,310,480,760].map((gross,i)=>({id:'path-'+(i+1),grossPnl:gross*factor,buyNotional:(2000+i*170)*factor,sellNotional:(1900+i*145)*factor}));}
function pathStats(paths){const net=paths.filter(p=>[p.grossPnl,p.buyNotional,p.sellNotional].every(Number.isFinite)&&p.buyNotional>=0&&p.sellNotional>=0).map(p=>p.grossPnl-(p.buyNotional+p.sellNotional)*.0025).sort((a,b)=>a-b);if(!net.length)return null;const q=p=>{const x=(net.length-1)*p,a=Math.floor(x),b=Math.ceil(x);return net[a]+(net[b]-net[a])*(x-a)};return {n:net.length,mean:net.reduce((a,b)=>a+b,0)/net.length,p10:q(.1),p90:q(.9),loss:net.filter(x=>x<0).length/net.length,net};}
function futureStats(){return pathStats(pathFixture==='empty'?[]:syntheticPaths(forecastHorizon))}
function moneyRange(st,baseline){return usd(st.p10)+'–'+usd(st.p90)+' ('+pct(st.p10/baseline*100)+'–'+pct(st.p90/baseline*100)+')'}
function performanceViews(){return '<div class="filters" aria-label="모의성과 보기">'+[['observed','관측된 성과'],['forecast','향후 예상성과'],['comparison','예측 사후비교']].map(([v,t])=>'<button class="btn" data-performance-view="'+v+'" aria-pressed="'+(performanceView===v)+'">'+t+'</button>').join('')+'</div>'}
function forecastAssumptions(){return '<details style="padding:0 16px"><summary>예측 가정과 범위 읽는 법</summary><p>모든 숫자는 작은 합성 경로의 계산 예시입니다. 실제 M40 백테스트·예측 엔진·에이전트 호출 결과가 아닙니다. 명목 손실확률은 보정 검증 전 합성 비율이며 에이전트 확신도가 아닙니다.</p><p>각 경로 순손익 = 비용 전 손익 − 예측구간 신규 (매수 거래대금 + 매도 거래대금) × 0.25%. 기존 보유의 과거 매수비용은 다시 차감하지 않습니다. 회전율에 따라 비용이 달라집니다. 초기금액의 고정 왕복 0.5%와 같다고 볼 수 없습니다. 체결 가격차 0, 세금·환율 변화·외부 입출금 미반영 가정입니다.</p><p>중앙 80%는 경로의 P10–P90입니다. 최대 손실 보장·수익 보장이 아니며 범위 밖 결과도 가능합니다. 1주는 기준일+7달력일, 1개월·3개월·1년은 기준일에 달력 1·3·12개월을 더한 같은날(없으면 월말), 평가는 범위 안 마지막 합성 거래일입니다. 과거 관측기간 선택과 별개입니다.</p><p>3개월·1년은 각각 독립된 합성 시나리오와 해당 구간 신규 거래대금입니다. 1개월 손익의 단순 배수나 연율화가 아닙니다. 표시 %는 초기 평가액 대비 기간 누적 순손익이며 실제 복리경로 엔진 결과가 아닙니다. 긴 기간에도 기준 정책을 고정해 읽는 예시이며 재평가·정책 변경 규칙은 미확정입니다. 미래 뉴스·금리·에이전트 결정을 알고 있다는 가정은 없습니다.</p></details>'}
function forecastPanel(){const w=forecastWindow(ASOF,forecastHorizon),st=futureStats(),baseline=equitySeries.at(-1).equity;return '<div class="sec-h"><h2>향후 예상성과 · 신규 제안</h2></div><p class="readonly-note">미구현 · 검증 전 · 합성 경로 예시 / 실제 예측 아님</p><div class="filters"><label for="forecast-horizon">예상 기간 <select id="forecast-horizon">'+Object.keys(HORIZONS).map(h=>'<option value="'+h+'" '+(forecastHorizon===h?'selected':'')+'>향후 '+horizonLabel(h)+'</option>').join('')+'</select></label><label for="path-fixture">검토용 경로 <select id="path-fixture"><option value="normal" '+(pathFixture==='normal'?'selected':'')+'>유효 합성 10경로</option><option value="empty" '+(pathFixture==='empty'?'selected':'')+'>유효 경로 없음</option></select></label></div><div class="metrics-intro"><b>기준 '+ASOF+' 장마감 (ET) → 향후 '+horizonLabel(forecastHorizon)+'</b><p>대상 '+w.start+'–'+w.end+' (ET)<br>평가 예정 '+w.evaluation+' 장마감 · 합성 평일 달력</p><p>초기 평가액 '+usd(baseline)+' · 같은 모의계좌 A<br>매수·매도 수수료 각 0.25% 차감 (예측구간 신규 거래대금)<br>과거 관측기간 선택은 이 미래 범위를 바꾸지 않습니다.<br>조회 기준 '+ASOF+' 18:05 ET</p></div><div class="metric-list">'+[['기대 순손익 (경로 평균)',st?usd(st.mean)+' / '+pct(st.mean/baseline*100):'미확인'],['중앙 80% 순손익 범위 (P10–P90)',st?moneyRange(st,baseline):'미확인'],['손실확률 (순손익 < 0)',st?(st.loss*100).toFixed(0)+'% · 합성 비율':'미확인'],['유효 경로 수',st?st.n+'개':'0개 · 예상성과 없음']].map(([a,b])=>'<div class="tile"><span class="lb">'+a+'</span><span class="v" style="font-size:16px">'+b+'</span></div>').join('')+'</div><p class="hint">아직 미래 평가기간입니다. 관측 손익·실제 가격·체결 값은 없습니다. 이 합성 결과의 정량 정확도는 미검증입니다.</p><details style="padding:0 16px"><summary>예측 원본과 판본</summary><p>예상기간 '+horizonLabel(forecastHorizon)+'<br>예시 forecastId: DEMO-NEW-'+forecastHorizon+'-'+(scenario==='current'?'M40-R1':'TARGET-R2')+'<br>기준 평가 '+ASOF+' 장마감 / 스냅샷 DEMO-DATA-1106<br>정책 '+(scenario==='current'?'M40 기본 rev.1':'결합 정책 rev.2 (설계예시)')+' / 예측 모형 DEMO-PATH-v1 / 비용 DEMO-FEE-025</p><p>예측은 별도 미구현 제안입니다. 현재 에이전트 참고 판단이 예측을 만들거나 매매에 반영된다는 뜻이 아닙니다. 새 예측은 새 ID로 저장하며 과거 예측 원본을 덮어쓰지 않는 방안입니다.</p></details>'+forecastAssumptions();}
const comparisonFixtures=Array.from({length:23},(_,i)=>{const asOf=i>=18?ASOF:calendar[i],horizon=i===21?'quarter':i===22?'year':i%2?'month':'week',w=forecastWindow(asOf,horizon),baseline=equitySeries.find(p=>p.date===asOf)?.equity,kind=i>=18?'pending':i%7===1?'mismatch':i%7===2?'missing':i%7===3?'one':'complete';return {id:'DEMO-F-'+String(i+1).padStart(3,'0'),asOf,horizon,...w,baseline,kind,policy:'M40-base-rev1',data:'DEMO-DATA-'+asOf,model:'DEMO-PATH-v1',fee:'DEMO-FEE-025',account:'DEMO-A',paths:i===2?[]:i===0?syntheticPaths(horizon).map((p,j)=>({...p,grossPnl:j*2})):syntheticPaths(horizon)}});
function comparisonResult(f){if(f.end>ASOF||!f.evaluation||f.evaluation>ASOF)return {status:'대기',reason:'목표기간 미도래 · 미래 관측 없음'};if(f.kind==='mismatch')return {status:'비교 불가',reason:'정책·계좌·기준·비용 중 비교조건 변경 예시'};const expected=weekdayDays(f.start,f.evaluation),points=equitySeries.filter(p=>p.date>=f.start&&p.date<=f.evaluation);if(!pathStats(f.paths))return {status:'미확인',reason:'유효 예측 경로 없음'};if(f.kind==='missing'||f.kind==='one'||points.length<=1||points.length!==expected.length||!f.baseline)return {status:'미확인',reason:f.kind==='one'?'관측 1점 예시 · 확정 비교 없음':'관측 누락/부족 · 확정 비교 없음'};const stats=pathStats(f.paths),last=points.at(-1);if(!stats)return {status:'미확인',reason:'유효 예측 경로 없음'};const actual=last.equity-f.baseline;return {status:'완료',stats,actual,error:actual-stats.mean,inside:actual>=stats.p10&&actual<=stats.p90,first:points[0].date,last:last.date,n:points.length};}
function comparisonRow(f){const r=comparisonResult(f),st=pathStats(f.paths);return '<article class="judgment"><div class="judgment-head"><b>'+f.id+' · '+horizonLabel(f.horizon)+'</b><span class="st">'+r.status+'</span></div><p>당시 저장했다고 가정한 합성 예측: '+f.asOf+' 18:05 ET (평가 기준 장마감)<br>대상 '+f.start+'–'+f.end+' · 평가 예정 '+f.evaluation+' 장마감 / 성숙 확인 18:05 ET</p><p>예측 평균 '+usd(st?.mean)+' · P10–P90 '+(st?moneyRange(st,f.baseline):'미확인')+'<br>예측 손실확률 '+(st?(st.loss*100).toFixed(0)+'%':'미확인')+' · 합성 '+(st?st.n:0)+'경로<br>매수·매도 수수료 각 0.25% 차감</p>'+(r.status==='완료'?'<p><b>이후 모의 관측 순손익 '+usd(r.actual)+' / '+pct(r.actual/f.baseline*100)+'</b><br>관측 '+r.first+'–'+r.last+' · '+r.n+'합성거래일<br>오차 (관측−예측 평균) '+usd(r.error)+' · 80%범위 '+(r.inside?'안':'밖')+'</p>':'<p>'+r.reason+' · 관측 손익 표시 안 함</p>')+'<details><summary>저장 원본과 비교 조건</summary><p>예상기간 '+horizonLabel(f.horizon)+'<br>초기 평가 '+usd(f.baseline)+' · 계좌 '+f.account+'<br>정책 '+f.policy+' / 자료 '+f.data+'<br>모형 '+f.model+' / 비용 '+f.fee+' (편도0.25%)</p><p>예측 원본을 이후 값으로 수정하지 않는 합성 예시입니다. 이후 계좌 평가도 같은 기준·비용 가정입니다. 단일 손실확률을 정답/오답이나 에이전트 확신도로 판정하지 않습니다.</p></details></article>';}
function comparisonPanel(){const all=comparisonFixtures.map(f=>({f,r:comparisonResult(f)})),valid=all.filter(x=>x.r.status==='완료'),max=Math.ceil(all.length/10);comparisonPage=Math.max(1,Math.min(comparisonPage,max));const counts=['완료','대기','미확인','비교 불가'].map(s=>s+' '+all.filter(x=>x.r.status===s).length).join(' · ');return '<div class="sec-h"><h2>예측 사후비교 · 합성 저장 이력</h2></div><p class="readonly-note">신규 제안 · 미구현/검증 전 · 과거 예측/이후 결과 모두 합성</p><div class="metrics-intro"><b>원본 예측과 이후 같은 조건의 모의 관측 비교</b><p>조회 기준 '+ASOF+' 18:05 ET · '+counts+'</p><p>전체 비교 가능 '+valid.length+'개 합성 예시 기준 · 페이지와 무관<br>실제 예측 정확도·확률 보정 수준은 미검증입니다.</p><p>완료는 목표기간이 끝났고 관측이 완전하며 계좌·정책·기준·비용이 같은 경우만입니다. 범위 안/밖은 이 개별 관측의 비교이며 신뢰도 검증 결과가 아닙니다.</p></div><div id="comparison-records">'+comparisonFixtures.slice((comparisonPage-1)*10,comparisonPage*10).map(comparisonRow).join('')+'</div><nav class="pager" aria-label="예측 사후비교 페이지"><button data-comparison-page="prev" '+(comparisonPage===1?'disabled':'')+'>이전</button><span>'+((comparisonPage-1)*10+1)+'–'+Math.min(comparisonPage*10,all.length)+' / '+all.length+'개<br>'+comparisonPage+' / '+max+' 페이지</span><button data-comparison-page="next" '+(comparisonPage===max?'disabled':'')+'>다음</button></nav>'+forecastAssumptions();}
function panel(){if(active!=='performance'||state!=='normal')return v4Panel();if(performanceView==='observed')return v4Panel().replace('<div class="sec-h"><h2>모의성과</h2></div>','<div class="sec-h"><h2>모의성과</h2></div>'+performanceViews());return '<section class="sec panel" id="panel-performance" role="tabpanel" aria-labelledby="tab-performance" tabindex="0">'+performanceViews()+(performanceView==='forecast'?forecastPanel():comparisonPanel())+'</section>';}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.performanceView){performanceView=b.dataset.performanceView;repaintPanel();document.querySelector('[data-performance-view="'+performanceView+'"]').focus({preventScroll:true});announce('모의성과 보기 변경 · '+b.textContent)}if(b.dataset.comparisonPage){comparisonPage+=b.dataset.comparisonPage==='next'?1:-1;const dir=b.dataset.comparisonPage;repaintPanel();(document.querySelector('[data-comparison-page="'+dir+'"]:not(:disabled)')||document.querySelector('[data-comparison-page]:not(:disabled)')).focus({preventScroll:true});el('panel-performance').scrollIntoView({block:'start'});announce('예측 사후비교 '+comparisonPage+' 페이지')}});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='forecast-horizon'){forecastHorizon=t.value;repaintPanel();el(t.id).focus({preventScroll:true})}if(t.id==='path-fixture'){pathFixture=t.value;repaintPanel();el(t.id).focus({preventScroll:true})}});

document.addEventListener('change',periodChange);
window.addEventListener('resize',measure);new ResizeObserver(measure).observe(document.querySelector('.strip'));new ResizeObserver(measure).observe(document.querySelector('.subnav'));render();
</script></body></html>
