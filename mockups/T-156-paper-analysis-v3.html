<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'"><meta name="demo-version" content="T-156-v3"><meta name="demo-token-source" content="src/app/globals.css@sha256:04e7b5bc8394"><title>StockInvest · 모의분석 데모 v3</title><style>:root {
  --bg: #0f1115;
  --bg2: #171a21;
  --bg3: #1f2430;
  --bg4: #262b36;
  --border: #262b36;
  --border2: #323848;
  --text: #e6e8ee;
  --muted: #8b93a7;
  --up: #ef4444;    /* 한국 관습: 상승 빨강 */
  --down: #3b82f6;  /* 한국 관습: 하락 파랑 */
  --accent: #f59e0b;
  --ok: #22c55e;
  --warn: #f59e0b;
  --danger: #ef4444;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --nav-h: 60px;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  max-width: 100vw;     /* 자식의 intrinsic 폭 초과 시에도 layout viewport 제한 — 모바일 fit-to-page 줌아웃 차단 */
  overflow-x: clip;     /* 수평 페이지 오버플로우 차단 — sticky 포지셔닝 유지됨 */
}
html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: ui-sans-serif, system-ui, -apple-system, "Noto Sans KR", sans-serif;
  font-size: 14px;
  -webkit-text-size-adjust: 100%;
  overscroll-behavior-y: contain;
}
/* 가로 폭만 viewport에 제한, 세로 스크롤은 막지 않음 */
body { width: 100%; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
a { color: inherit; text-decoration: none; }
.num { font-variant-numeric: tabular-nums; }
.up { color: var(--up); }
.down { color: var(--down); }
@keyframes ti-spin { to { transform: rotate(360deg); } }

/*
 * T-108 운용 화면 공용 스타일 — 승인 데모 v3(mockups/T-108-menu-home-v3.html) 112~235행 「앱 화면」 클래스를 이름 그대로 옮겼다.
 * (데모 문서 틀 .page·.controls·.decide·.phone·.frm·.scrl·.cur 와 비서 화면 .bubble·.qchips·.compose 는 옮기지 않음)
 *
 * - CSS Module 이라 클래스가 이 파일 안에서만 유효하다(전역 .card·.btn·.sec-h 등과 섞이지 않음).
 *   단 .num·.up·.down 은 globals.css 전역 클래스를 그대로 쓴다(컴포넌트가 className 에 같이 붙인다).
 * - 색은 globals.css 토큰 이름만. 리터럴 #fca5a5·#86efac·#2a1416·rgba(…) 는 데모 값 그대로(새 토큰 아님 — 가이드 §2.0).
 * - 데모의 @container app (min-width: 900px) → @media (min-width: 900px) (T-084 선례, 가이드 §0.4).
 * - 데모에 없던 것(가이드 §8.4 재량 — 시각 결과 같음): 포커스 링을 클래스마다 붙임(데모는 전역 :focus-visible),
 *   스피너 keyframes 를 이 모듈 안에 둠(모듈 안 animation 이름은 지역화되므로), .scr 아래 여백 16px(데모 .scrl 몫),
 *   .gate·.res·.btrow 를 시트 밖에서도 쓰게 단독 선택자로(데모는 .sheet 아래), 띠 칩 줄 오른쪽 끝 페이드(.sws.fade — 가이드 §8.2 P2),
 *   foot 안 링크 밑줄·44px(.sec-foot a), 미니 띠 제목(.strip-title — 데모는 인라인 style), a.stage 44px(미니 띠 배지가 링크).
 */

/* ── 안전 상태 띠 (홈·거래 공통, 스크롤해도 보임) ── */
.strip { position: sticky; top: 0; z-index: 6; background: var(--bg2); border-bottom: 1px solid var(--border); padding: 8px 12px 10px; }
.strip-h { display: flex; align-items: center; gap: 8px; min-width: 0; }
.stage { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; padding: 4px 10px; border-radius: 6px; border: 1px solid var(--border2); white-space: nowrap; }
.stage .dot { width: 8px; height: 8px; flex: none; }
a.stage, button.stage { min-height: 44px; flex: none; }
.stage.obs { color: var(--accent); border-color: rgba(245,158,11,.5); }
.stage.obs .dot { background: var(--accent); border-radius: 50%; }
.stage.live { color: #fca5a5; border-color: rgba(239,68,68,.6); background: #2a1416; }
.stage.live .dot { background: var(--danger); border-radius: 1px; transform: rotate(45deg); }
.stage.mixed { color: #fca5a5; border-color: rgba(239,68,68,.6); }
.stage.mixed .dot { background: var(--danger); clip-path: polygon(50% 0, 100% 100%, 0 100%); }
.stage.halt { color: var(--text); border-color: var(--border2); background: var(--bg3); }
.stage.halt .dot { background: var(--muted); border-radius: 1px; }
.stage.err { color: #fca5a5; border-color: var(--danger); }
.stage.err .dot { background: transparent; border: 2px solid var(--danger); border-radius: 50%; }
.strip-sum { font-size: 12px; color: var(--muted); line-height: 1.45; min-width: 0; flex: 1; overflow-wrap: anywhere; word-break: keep-all; }
.strip-sum b { color: var(--text); }
.strip-title { font-size: 15px; font-weight: 700; color: var(--text); }
.strip-go { flex: none; min-width: 44px; min-height: 44px; display: inline-flex; align-items: center; justify-content: center; border-radius: 8px; color: var(--muted); font-size: 12px; font-weight: 600; }
.sws { display: flex; gap: 6px; overflow-x: auto; margin-top: 8px; scrollbar-width: none; }
.sws::-webkit-scrollbar { display: none; }
.sws.fade { -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 28px), transparent); mask-image: linear-gradient(to right, #000 calc(100% - 28px), transparent); }
.sw { flex: none; font-size: 11px; font-weight: 600; padding: 4px 8px; border-radius: 6px; border: 1px solid var(--border2); background: var(--bg3); color: var(--text); white-space: nowrap; line-height: 1.4; }
.sw i { font-style: normal; color: var(--muted); font-weight: 500; margin-right: 4px; }
.sw.bad { border-color: rgba(239,68,68,.6); background: #2a1416; color: #fca5a5; }
.sw.warn { border-color: rgba(245,158,11,.5); color: var(--accent); }
.sw.sep { background: transparent; border-style: dashed; }
.strip-alert { margin-top: 8px; font-size: 12px; line-height: 1.5; color: #fca5a5; background: #2a1416; border: 1px solid rgba(239,68,68,.5); border-left: 3px solid var(--danger); border-radius: 6px; padding: 6px 8px; word-break: keep-all; overflow-wrap: anywhere; }

/* ── 화면 공통 ── */
.scr { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; padding: 8px 0 16px; }
.col { display: grid; gap: 8px; min-width: 0; align-content: start; }
.sec { background: var(--bg2); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); min-width: 0; }
.sec-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 12px 4px 16px; min-height: 44px; }
.sec-h h2 { margin: 0; font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .3px; line-height: 1.4; }
.sec-h h2 small { font-weight: 500; font-size: 11px; margin-left: 4px; }
.lnk { min-height: 44px; min-width: 44px; display: inline-flex; align-items: center; justify-content: flex-end; gap: 2px; font-size: 12px; color: var(--muted); font-weight: 600; white-space: nowrap; padding: 0 4px; }
.sec-b { padding: 0 16px 12px; }
.sec-foot { font-size: 11px; color: var(--muted); padding: 0 16px 10px; line-height: 1.5; }
/* foot 안 링크(계좌 전체 손익 → 자산 기록, 401 → 로그인): 밑줄로 링크임을 보이고(색만 쓰지 않음) 터치 44px */
.sec-foot a { text-decoration: underline; display: inline-flex; align-items: center; min-height: 44px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; background: var(--border); border-top: 1px solid var(--border); }
.tile { background: var(--bg2); padding: 10px 12px; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.tile.wide { grid-column: 1 / -1; }
.tile .lb { font-size: 12px; color: var(--muted); line-height: 1.4; word-break: keep-all; }
.tile .v { font-size: 18px; font-weight: 700; line-height: 1.25; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.tile .v small { font-size: 12px; font-weight: 600; color: var(--muted); margin-left: 2px; }
.tile .mk { font-size: 13px; line-height: 1.45; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; word-break: keep-all; }
.tile .mk i { font-style: normal; color: var(--muted); display: inline-block; min-width: 28px; }
.tile .meta { font-size: 11px; color: var(--muted); line-height: 1.45; overflow-wrap: anywhere; word-break: keep-all; }
.tile.dim .v, .tile.dim .mk { color: var(--muted); }
.st { display: inline-flex; align-items: center; gap: 4px; align-self: flex-start; font-size: 11px; font-weight: 700; padding: 2px 6px; border-radius: 6px; border: 1px solid var(--border2); color: var(--text); background: var(--bg); line-height: 1.4; white-space: normal; overflow-wrap: anywhere; word-break: keep-all; }
/* T-130 D4-A — 분석 › 데이터 상태에서만 한국어 칩 뒤에 붙는 영문 원인 코드 */
.stCode { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; font-weight: 600; margin-left: 4px; }
.st.zero { border-color: rgba(34,197,94,.5); color: #86efac; }
.st.unknown { border-style: dashed; color: var(--muted); }
.st.error { border-color: var(--danger); color: #fca5a5; }
.st.stale { border-style: dotted; border-color: var(--muted); color: var(--muted); }
.st.partial { border-color: rgba(245,158,11,.5); color: var(--accent); }
.st.blocked { border-color: rgba(239,68,68,.6); color: #fca5a5; background: #2a1416; }
.st.off { color: var(--muted); }
.st.prep { border-style: dashed; border-color: var(--muted); color: var(--muted); }
.retry { min-height: 44px; align-self: flex-start; padding: 0 12px; border-radius: 8px; border: 1px solid var(--border2); background: var(--bg3); font-size: 12px; font-weight: 600; }
.skel { display: block; height: 14px; border-radius: 4px; background: var(--bg3); }
.skel.big { height: 22px; width: 60%; }
.skel.w80 { width: 80%; }
.skel.w50 { width: 50%; }
.rows { border-top: 1px solid var(--border); }
.rowl { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; min-height: 56px; padding: 8px 12px 8px 16px; border-bottom: 1px solid var(--border); width: 100%; text-align: left; }
.rowl:last-child { border-bottom: 0; }
.rowl .ic { width: 22px; height: 22px; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; border-radius: 6px; border: 1px solid var(--border2); color: var(--muted); }
.rowl .ic.e { border-color: var(--danger); color: #fca5a5; }
.rowl .ic.w { border-color: rgba(245,158,11,.6); color: var(--accent); }
.rowl .ic.i { color: var(--text); }
.rowl .t, .rowl .s { display: block; }
.rowl .t { font-size: 13px; font-weight: 600; line-height: 1.4; overflow-wrap: anywhere; word-break: keep-all; }
.rowl .s { font-size: 12px; color: var(--muted); line-height: 1.45; overflow-wrap: anywhere; word-break: keep-all; margin-top: 2px; }
.rowl .r { font-size: 12px; color: var(--muted); white-space: nowrap; text-align: right; font-variant-numeric: tabular-nums; }
.empty { padding: 14px 16px; font-size: 13px; color: var(--muted); line-height: 1.55; border-top: 1px solid var(--border); word-break: keep-all; }
.empty b { color: var(--text); }
.lines { border-top: 1px solid var(--border); }
.ln { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 8px; padding: 9px 16px; border-bottom: 1px solid var(--border); font-size: 13px; line-height: 1.5; align-items: start; }
.ln:last-child { border-bottom: 0; }
.ln .k { font-size: 12px; color: var(--muted); font-weight: 600; padding-top: 1px; }
.ln .d { overflow-wrap: anywhere; word-break: keep-all; min-width: 0; }
.ln .d .m { display: block; font-size: 11px; color: var(--muted); margin-top: 2px; }
.mt { width: 100%; border-collapse: collapse; font-size: 13px; border-top: 1px solid var(--border); }
.mt caption { caption-side: bottom; text-align: left; font-size: 11px; color: var(--muted); padding: 6px 16px 10px; line-height: 1.5; }
.mt th, .mt td { padding: 7px 8px; border-bottom: 1px solid var(--border); text-align: right; font-variant-numeric: tabular-nums; vertical-align: top; }
.mt th:first-child, .mt td:first-child { text-align: left; padding-left: 16px; color: var(--muted); font-weight: 600; font-size: 12px; }
.mt thead th { font-size: 12px; color: var(--muted); font-weight: 600; background: var(--bg2); }
.mt thead th small { display: block; font-weight: 500; font-size: 11px; }
.mt td.dim { color: var(--muted); }
.act { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 8px; padding: 8px 16px; border-bottom: 1px solid var(--border); font-size: 13px; line-height: 1.5; }
.act:last-child { border-bottom: 0; }
.act .tm { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; padding-top: 1px; }
.act .s { display: block; font-size: 12px; color: var(--muted); }
.seg2 { display: flex; gap: 4px; background: var(--bg3); padding: 3px; border-radius: 8px; }
.seg2 button { flex: 1 1 0; min-height: 44px; padding: 0 8px; border-radius: 6px; font-size: 12px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.seg2 button[aria-pressed="true"] { background: var(--bg4); color: var(--text); box-shadow: inset 0 -2px 0 var(--accent); }
.subnav { position: sticky; top: var(--strip-h, 0px); z-index: 5; background: var(--bg); padding: 8px 12px; border-bottom: 1px solid var(--border); }
.btn { min-height: 44px; padding: 0 14px; border-radius: 8px; font-size: 13px; font-weight: 700; border: 1px solid var(--border2); background: var(--bg3); display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.btn.pri { background: var(--accent); color: #221a05; border-color: var(--accent); }
.btn.dz { background: #2a1416; color: #fca5a5; border-color: rgba(239,68,68,.6); }
.btn[disabled] { opacity: .55; cursor: not-allowed; }
.btn .d { font-size: 11px; font-weight: 600; opacity: .85; }
.card { margin: 0 12px 8px; background: var(--bg3); border: 1px solid var(--border2); border-radius: 8px; padding: 10px 12px; font-size: 13px; line-height: 1.5; }
.card .h { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-weight: 700; }
.card .s { font-size: 12px; color: var(--muted); margin-top: 2px; overflow-wrap: anywhere; word-break: keep-all; }
.card .bt { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
.pill { font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 6px; border: 1px solid var(--border2); color: var(--muted); }
.pill.buy { color: #fca5a5; border-color: rgba(239,68,68,.5); }
.pill.sell { color: #93c5fd; border-color: rgba(59,130,246,.5); }
.kv { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; padding: 10px 16px; border-bottom: 1px solid var(--border); font-size: 13px; align-items: center; min-height: 52px; }
.kv:last-child { border-bottom: 0; }
.kv .s { grid-column: 1 / -1; font-size: 11px; color: var(--muted); line-height: 1.5; }
.bar { height: 6px; border-radius: 3px; background: var(--bg4); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--muted); }

/* 승인 안내·결과(데모 .sheet .gate / .sheet .res — 시트 밖 ScenarioDetail 에서도 쓰게 단독 선택자) */
.gate { margin: 10px 0; padding: 8px 10px; border-radius: 8px; border: 1px solid rgba(245,158,11,.5); background: rgba(245,158,11,.06); font-size: 12px; line-height: 1.55; word-break: keep-all; }
.gate.bad { border-color: rgba(239,68,68,.6); background: #2a1416; color: #fca5a5; }
.res { margin: 10px 0 0; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border2); font-size: 12px; line-height: 1.55; word-break: keep-all; }
.res.ok { border-color: rgba(34,197,94,.5); color: #86efac; }
.res.e { border-color: var(--danger); color: #fca5a5; }
.btrow { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
.btrow .full { grid-column: 1 / -1; }

/* 스피너 — globals.css 의 ti-spin 과 같은 모양을 이 모듈 안에 둔다(모듈 안 animation 이름은 지역화된다) */
@keyframes spin { to { transform: rotate(360deg); } }
.spin { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--border2); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; flex: none; }
@media (prefers-reduced-motion: reduce) { .spin { animation: none; } }

/* 화면 읽기 전용 글자(보이지 않음) */
.sr { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

/* 포커스 링(데모 전역 :focus-visible 을 클래스마다) */
.lnk:focus-visible, .rowl:focus-visible, .retry:focus-visible, .strip-go:focus-visible, .stage:focus-visible,
.seg2 button:focus-visible, .btn:focus-visible, .sec-foot a:focus-visible, .res:focus-visible {
  outline: 2px solid var(--text); outline-offset: 2px; border-radius: 4px;
}

/* ── 데스크톱 복원 (≥900px) ── */
@media (min-width: 900px) {
  .scr { grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 12px; padding: 12px 16px 16px; }
  .scr.one { grid-template-columns: minmax(0, 760px); justify-content: center; }
  .sec { border: 1px solid var(--border); border-radius: 10px; }
  .strip { padding: 10px 24px; }
  .subnav { padding: 8px 16px; }
  .subnav .seg2 { max-width: 520px; }
}


.bn { position: fixed; left: 0; right: 0; bottom: 0; height: calc(var(--nav-h) + var(--safe-bottom)); padding-bottom: var(--safe-bottom); background: var(--bg2); border-top: 1px solid var(--border); display: grid; grid-template-columns: repeat(5, 1fr); z-index: 20; }
.bn a { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 56px; color: var(--muted); font-size: 11px; font-weight: 600; line-height: 1.2; }
.bn a svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.bn a[aria-current="page"] { color: var(--accent); }
.bn .bar { position: absolute; top: 0; left: 30%; right: 30%; height: 2px; background: var(--accent); border-radius: 0 0 2px 2px; }
.bn a:focus-visible { outline: 2px solid var(--text); outline-offset: -2px; border-radius: 4px; }
@media (min-width: 900px) {
  .bn { left: 50%; right: auto; width: 720px; transform: translateX(-50%); border: 1px solid var(--border); border-bottom: 0; border-radius: 14px 14px 0 0; }
}

/* 데모 도구는 앱 화면 밖. 앱의 globals/ops/BottomTabs CSS 스냅샷은 위 그대로. */

      <circle cx="12" cy="12" r="3" /></svg><span>설정</span></a></nav><script>
let proposed=true,detail=false,segment='today',active='collection',scenario='current',state='normal',countMode='normal',query='',judgmentFilter='all';
const labels={collection:'수집상태',judgments:'종목판단',signals:'모의시그널',performance:'모의성과'};
const pages={collection:1,judgments:1,signals:1,performance:1};
const el=id=>document.getElementById(id);
const sec=(id,title,body)=>'<section class="sec" aria-labelledby="'+id+'"><div class="sec-h"><h2 id="'+id+'">'+title+'</h2></div>'+body+'</section>';
const row=(title,sub)=>'<div class="rowl"><span class="ic" aria-hidden="true">·</span><span><span class="t">'+title+'</span><span class="s">'+sub+'</span></span><span></span></div>';
function today(){return '<div class="scr"><div class="col">'+sec('ai','장마감 AI 분석','<table class="mt"><caption>기존 구성 · 값은 데모에서 생략</caption><thead><tr><th scope="col">단계</th><th scope="col">국내</th><th scope="col">해외</th></tr></thead><tbody>'+['평가 종목','규칙 후보','AI 매수 판단','시그널 생성','검증 관문 차단','제외 사유'].map(x=>'<tr><th scope="row">'+x+'</th><td>—</td><td>—</td></tr>').join('')+'</tbody></table>')+sec('candidates','후보',row('시그널로 이어진 종목 없음','합성 예시 · 실제 조회 없음'))+'</div><div class="col">'+sec('symbols','종목별',row('리서치 추적','기존 리서치분석 — 과거 통계 관찰용, 자동매매와 별개')+row('주도주','기존 화면 그대로')+row('관심 종목 관리 (현재 즐겨찾기)','추가·삭제·메모·리서치 추적 설정 그대로')+'<a class="rowl" href="?tab=m40" data-open><span class="ic" aria-hidden="true">▤</span><span><span class="t">'+(proposed?'모의분석':'M40 모의분석')+'</span><span class="s">수집 · 종목 판단 · 모의 매수·매도 · 모의성과 / 실주문 없음</span></span><span>›</span></a>')+'</div></div>'}
function controls(){return '<aside class="review-controls" aria-label="합성 데모 검토 도구"><label>데모 상태<select id="state">'+Object.entries({normal:'정상',empty:'빈 상태',loading:'로딩',error:'조회 오류',unauthorized:'접근 제한 (403)'}).map(([v,t])=>'<option value="'+v+'" '+(state===v?'selected':'')+'>'+t+'</option>').join('')+'</select></label><label>목록 건수<select id="count">'+Object.entries({normal:'기본 예시 (수집 4개 / 나머지 23개)',stress:'긴 목록 23개씩',0:'0개',1:'1개',10:'10개',11:'11개'}).map(([v,t])=>'<option value="'+v+'" '+(countMode===v?'selected':'')+'>'+t+'</option>').join('')+'</select></label><label>정책 시나리오<select id="scenario"><option value="current" '+(scenario==='current'?'selected':'')+'>현재 연결상태</option><option value="target" '+(scenario==='target'?'selected':'')+'>설계예시 · 거래연결 미구현</option></select></label><button class="btn" data-reset>검토 초기화</button></aside>'}
function policy(){if(state!=='normal')return '';return '<section class="policy" aria-label="선택한 실행의 적용 정책"><b>'+(scenario==='current'?'현재 연결상태: M40 기본 · 에이전트 참고 전용 / 미호출':'설계예시: M40 + 에이전트 규칙 선택 (거래연결 미구현)')+'</b><p>선택 실행: 가상 회차 023 · 적용 정책 개정: '+(scenario==='current'?'M40 기본 / 예시 rev.1':'가상 결합 정책 / 예시 rev.2')+'</p><p>기본 규칙: M40 · 에이전트 실행: '+(scenario==='current'?'미호출 · 판단 반영: 안 함':'가상 완료 · 판단 반영: 설계예시만')+'</p><details><summary>정책과 판단 연결 자세히</summary><p>'+(scenario==='current'?'자료 → M40 후보·규칙 → 모의 매매 의도 → 모의 결과. 에이전트를 호출해도 현재 참고 판단은 매매를 바꾸지 않습니다. 기본 설정은 미호출입니다.':'자료 → 후보 → 에이전트가 검증된 규칙 선택 → 모의 매매 의도 → 모의 결과. 이 연결은 제안이며 현재 운영 동작이 아닙니다. 단순 에이전트 호출만으로 구현되지 않습니다.')+'</p><p>모의 전용 주문 차단은 전역 실거래 설정과 별개입니다. 현재 예약 실행은 전역 모의 설정도 필요합니다.</p><p>적용 상태는 선택 회차에 저장된 기록으로 확인해야 합니다. 현재 설정으로 과거 실행을 추정하지 않습니다.</p></details><details><summary>결정 필요 · 구현 범위 두 가지</summary><p><b>A · 조회 화면</b><br>v3 화면과 저장된 정책 상태를 정확히 표시합니다. 현재 매매 판단 방식은 그대로입니다.</p><p><b>B · 모의 정책 연결까지</b><br>M40 + 에이전트 규칙 선택을 모의 매매에 연결합니다. 선택 방식 설계·기존 검증 기준 대조·블라인드 백테스트를 별도 검증한 뒤 포함합니다.</p><p>화면 검토는 정책 실행 활성화가 아닙니다. 새 임계값·규칙을 이 예시로 확정하지 않습니다.</p></details></section>'}
function baseCount(){if(state==='empty')return 0;return countMode==='normal'?(active==='collection'?4:23):countMode==='stress'?23:Number(countMode)}
function records(){let positiveRank=0;return Array.from({length:baseCount()},(_,i)=>{const positive=i%3!==2,rank=positive?++positiveRank:null;return {i:i+1,symbol:'DEMO-'+String(i+1).padStart(2,'0'),positive,rank,selected:positive&&rank<=5}}).filter(r=>active!=='judgments'||(r.symbol.toLowerCase().includes(query.toLowerCase())&&(judgmentFilter==='all'||(judgmentFilter==='selected'?r.selected:!r.selected))))}
function pager(total){const max=Math.max(1,Math.ceil(total/10));pages[active]=Math.min(Math.max(1,pages[active]),max);const page=pages[active],start=total?(page-1)*10+1:0,end=Math.min(page*10,total);return '<nav class="pager" aria-label="'+labels[active]+' 페이지"><button data-page="prev" '+(page===1?'disabled':'')+'>이전</button><span class="num">'+start+'–'+end+' / '+total+'개<br>'+page+' / '+max+' 페이지</span><button data-page="next" '+(page===max?'disabled':'')+'>다음</button></nav>'}
function record(r){if(active==='collection')return '<article class="judgment"><b>'+(['원가격 시세','분할 조정 일봉','S&P 500 지수','보조 시세'][((r.i-1)%4)])+' · 합성 출처 '+r.i+'</b><p>가상 11-06 세션 (ET) · 출처별 합성 집계</p><details><summary>수신·가용 시각</summary><p>가상 수신 11-07 08:00 KST · 가용 08:01 KST<br>원문 공개 시각 미확인 · 뉴스·공시 수집 미확인</p></details></article>';
if(active==='judgments')return '<article class="judgment"><div class="judgment-head"><b>가상 종목 '+r.i+' · '+r.symbol+'</b><span class="st '+(r.selected?'partial':'unknown')+'">'+(r.selected?'선정':'미선정')+'</span></div><p>모멘텀 '+(r.positive?'+8.1%':'−3.2%')+' · '+(r.positive?'양수 후보 내 순위 '+r.rank:'순위 대상 아님')+'</p><p><b>최종 판단: '+(r.selected?'모의 매수':'매매 없음')+'</b></p><p>'+(scenario==='current'?(r.selected?'M40 기본: 양수 모멘텀 · 선정 조건 충족':(r.positive?'M40 기본: 양수지만 상위 5종목 밖 · 선정 제외':'M40 기본: 음수 모멘텀 · 선정 제외')):(r.selected?'설계예시: 검증된 규칙 중 선택 · 구체 선택 방식 미확정':'설계예시: 기본 적격·상위 5종목 제한 유지 · 대기'))+'</p><details><summary>판단 근거와 적용 규칙</summary><p>가상 회차 023 · '+(scenario==='current'?'적용 M40 기본 rev.1 · 에이전트 미호출 · 반영 없음':'설계예시 결합 rev.2 · 검증된 규칙 선택 예시 · 거래 연결 미구현')+'</p><p>선정과 매매 의도는 별개입니다. 기본·설계예시 모두 적격 조건과 상위 5종목 제한을 유지합니다. 수량·모의현금 제약은 저장 근거로 확인합니다.</p></details></article>';
if(active==='signals')return '<article class="judgment"><div class="judgment-head"><b>'+r.symbol+'</b><span class="'+(r.i%2?'up':'down')+'">모의 '+(r.i%2?'매수':'매도')+'</span></div><p>전진 모의 · 모형 평가 완료 (합성)</p><p>이유: '+(r.i%2?'양수 후보 선정':'모의 보유분 교체 조건')+' · 정책 '+(scenario==='current'?'M40 기본 rev.1':'설계예시 결합 rev.2')+'</p><details><summary>모의 기록 상세</summary><p>의도 2주 · 모형 가격 USD 50.00 · 모형 비용 USD 0.25<br>가상 회차 '+r.i+' · 기준/예정 세션은 이 예시에서 생략<br>실제 주문·체결이 아닙니다.</p></details></article>';
return '<div class="judgment"><b>가상 관측점 '+r.i+'</b><p>모의 평가액 <span class="num">USD '+(12000+r.i*4).toLocaleString('en-US')+'</span> · 전진 관측 · 실제 자산 아님</p></div>'}
function metrics(n){return '<div class="metrics-intro"><b>전진 모의성과 · 합성 '+n+'관측점</b><p>초기 리허설과 분리 · 조회된 합성 시리즈 기준</p></div><div class="metric-list">'+[['수익률',n>1?'+'+(((12000+n*4)/12004-1)*100).toFixed(2)+'%':'아직 없음'],['연환산 수익률 (CAGR)','아직 없음'],['관측 최대 낙폭 (MDD)',n>1?'0.00%':'아직 없음'],['실현·미실현 손익','분리 계산 미지원']].map(([a,b])=>'<div class="tile"><span class="lb">'+a+'</span><span class="v '+(a==='수익률'&&n>1?'up':'')+'">'+b+'</span></div>').join('')+'</div><p class="hint">요약 지표는 페이지와 무관합니다. 0~1점이면 수익률·MDD는 없음. CAGR은 365일 이상 완전한 관측 이력이 필요합니다. 합성 수익률은 전체 합성 시리즈로 계산한 고정 예시입니다.</p>'}
function panel(){if(state==='empty')return '<section class="sec panel" id="panel-'+active+'" role="tabpanel" aria-labelledby="tab-'+active+'" tabindex="0"><div class="sec-h"><h2>'+labels[active]+'</h2></div><p class="empty">아직 저장된 분석 기록이 없습니다.<br>선택 회차·적용 정책 개정·평가 적격·양수/음수 집계는 미확인입니다. 성과 없음은 0수익을 뜻하지 않습니다.</p>'+pager(0)+'</section>';if(state==='loading'||state==='error'||state==='unauthorized')return '<section class="sec panel" id="panel-'+active+'" role="tabpanel" aria-labelledby="tab-'+active+'" tabindex="0" aria-busy="'+(state==='loading')+'"><p class="empty" role="'+(state==='loading'?'status':'alert')+'"><b>'+({loading:'불러오는 중…',error:'조회하지 못했습니다',unauthorized:'조회 권한이 없습니다 (403)'})[state]+'</b><br>저장 비공개 자료는 표시하지 않습니다. 수집이나 분석을 실행하지 않습니다.</p>'+(state==='error'?'<button class="retry" data-retry>다시 조회 · 합성 예시</button>':'')+'</section>';
const data=records(),pg=pager(data.length);return '<section class="sec panel" id="panel-'+active+'" role="tabpanel" aria-labelledby="tab-'+active+'" tabindex="0"><div class="sec-h"><h2>'+labels[active]+'</h2></div>'+(active==='collection'?'<p class="hint">참조 '+(countMode==='normal'||countMode==='stress'?23:Number(countMode))+' · 평가 적격 '+(countMode==='normal'||countMode==='stress'?23:Number(countMode))+' · 합성 자료<br>양수 후보 '+((countMode==='normal'||countMode==='stress'?23:Number(countMode))-Math.floor((countMode==='normal'||countMode==='stress'?23:Number(countMode))/3))+' · 음수 후보 '+Math.floor((countMode==='normal'||countMode==='stress'?23:Number(countMode))/3)+' · 선정 최대 5종목<br>가격 세션 11-06 ET · 저장 분석 가상 11-07 08:05 KST<br>수집 완료·원문 공개·분석 기준 시각은 서로 다릅니다.</p>':'')+(active==='judgments'?'<div class="filters"><label for="query">종목 <input id="query" value="'+query+'" placeholder="DEMO-01"></label><label for="filter">판단 <select id="filter">'+[['all','전체'],['selected','선정'],['excluded','미선정']].map(([v,t])=>'<option value="'+v+'" '+(judgmentFilter===v?'selected':'')+'>'+t+'</option>').join('')+'</select></label></div>':'')+(active==='performance'?metrics(data.length):'')+'<div id="records">'+(data.length?data.slice((pages[active]-1)*10,pages[active]*10).map(record).join(''):'<p class="empty">조건에 맞는 기록이 없습니다. 성과 없음은 0수익을 뜻하지 않습니다.</p>')+'</div>'+pg+'<p class="hint">'+(active==='signals'?'서로 다른 가상 회차의 합성 이력입니다. 23개 동시 신규 매수가 아닙니다. 조회분에서 페이지를 나누며 운영 전체 이력을 뜻하지 않습니다.':active==='performance'?'관측점 목록만 10개씩 나눕니다. 운영 이력 잘림 시 전체 성과는 미확인으로 표시해야 합니다.':active==='collection'&&countMode==='normal'?'기본 출처 집계 4개 · 한 페이지에도 페이지 상태를 표시합니다.':'목록은 한 페이지 최대 10개 · 모든 값은 합성 예시입니다.')+'</p></section>'}
function render(){el('current').setAttribute('aria-pressed',String(!proposed));el('proposed').setAttribute('aria-pressed',String(proposed));document.querySelectorAll('[data-seg]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.seg===segment)));el('page').innerHTML=detail?'<div class="detail-head"><button data-back>‹ 오늘 분석</button><h1 id="detail-title" tabindex="-1">'+(proposed?'모의분석':'M40 모의분석')+'</h1></div>'+controls()+'<p class="readonly-note">모의 전용 · 실주문 없음 · 모든 자료는 합성 예시</p>'+policy()+'<nav class="m40-nav" role="tablist" aria-label="모의분석 상세">'+Object.entries(labels).map(([k,t])=>'<button role="tab" id="tab-'+k+'" aria-controls="panel-'+k+'" aria-selected="'+(active===k)+'" tabindex="'+(active===k?0:-1)+'" data-tab="'+k+'">'+t+'</button>').join('')+'</nav><div id="panel-host">'+panel()+'</div>':segment==='today'?today():'<p class="empty">'+(segment==='verify'?'검증·성과':'데이터 상태')+' · 기존 화면 보존 영역. 이 데모에서는 값만 생략했습니다.</p>';measure()}
function announce(t){el('announcement').textContent=t}
function measure(){const a=document.querySelector('.strip').getBoundingClientRect().height,b=document.querySelector('.subnav').getBoundingClientRect().height;document.documentElement.style.setProperty('--strip-h',a+'px');document.documentElement.style.setProperty('--sub-h',b+'px');document.querySelector('.subnav').style.setProperty('--strip-h',a+'px')}
function repaintPanel(){el('panel-host').innerHTML=panel()}
function goTab(key){active=key;render();el('tab-'+key).focus({preventScroll:true});el('tab-'+key).scrollIntoView({block:'nearest'});announce(labels[key]+' · '+pages[key]+' 페이지')}
document.addEventListener('click',e=>{const b=e.target.closest('button,a');if(!b)return;if(b.id==='current'||b.id==='proposed'){proposed=b.id==='proposed';detail=false;segment='today';render();return}if(b.hasAttribute('data-open')){e.preventDefault();detail=true;render();el('detail-title').focus();return}if(b.hasAttribute('data-back')){detail=false;render();document.querySelector('[data-open]').focus();return}if(b.dataset.seg){segment=b.dataset.seg;detail=false;render();return}if(b.dataset.tab){goTab(b.dataset.tab);return}if(b.dataset.page){pages[active]+=b.dataset.page==='next'?1:-1;const dir=b.dataset.page;repaintPanel();const target=document.querySelector('[data-page="'+dir+'"]:not(:disabled)')||document.querySelector('[data-page]:not(:disabled)')||el('panel-'+active);target.focus({preventScroll:true});el('panel-'+active).scrollIntoView({block:'start'});announce(labels[active]+' '+pages[active]+' 페이지 표시');return}if(b.hasAttribute('data-reset')){state='normal';countMode='normal';scenario='current';query='';judgmentFilter='all';Object.keys(pages).forEach(k=>pages[k]=1);render();document.querySelector('[data-reset]').focus();announce('합성 검토 조건 초기화');return}if(b.hasAttribute('data-retry')){state='normal';render();el('state').focus();return}if(b.dataset.nav){e.preventDefault();if(b.dataset.nav==='분석'){detail=false;segment='today';render()}else announce('기존 '+b.dataset.nav+' 탭은 변경하지 않습니다.')}});
document.addEventListener('keydown',e=>{if(!e.target.dataset.tab)return;const ks=Object.keys(labels),i=ks.indexOf(active);let next;if(e.key==='ArrowRight')next=ks[(i+1)%4];if(e.key==='ArrowLeft')next=ks[(i+3)%4];if(e.key==='Home')next=ks[0];if(e.key==='End')next=ks[3];if(next){e.preventDefault();goTab(next)}});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='filter'){judgmentFilter=t.value;pages.judgments=1;repaintPanel();el('filter').focus();return}if(!['state','count','scenario'].includes(t.id))return;if(t.id==='state'){state=t.value;if(state==='unauthorized'){query='';judgmentFilter='all';Object.keys(pages).forEach(k=>pages[k]=1)}}if(t.id==='count'){countMode=t.value;Object.keys(pages).forEach(k=>pages[k]=1)}if(t.id==='scenario')scenario=t.value;render();el(t.id).focus({preventScroll:true});announce('합성 데모 조건 변경 · '+t.selectedOptions[0].text)});
document.addEventListener('input',e=>{if(e.target.id==='query'){const pos=e.target.selectionStart;query=e.target.value.replace(/[^a-zA-Z0-9-]/g,'');pages.judgments=1;repaintPanel();el('query').focus({preventScroll:true});el('query').setSelectionRange(pos,pos)}});
window.addEventListener('resize',measure);new ResizeObserver(measure).observe(document.querySelector('.strip'));new ResizeObserver(measure).observe(document.querySelector('.subnav'));render();
</script></body></html>
