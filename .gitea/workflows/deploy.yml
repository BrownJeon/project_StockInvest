name: Deploy StockInvest

on:
  push:
    branches: [main, master]

jobs:
  deploy:
    runs-on: linux
    steps:
      - name: Sync to runtime directory (NFS)
        run: |
          cd /home/brownjeon/NFS/homes/brownjeon/project/StockInvest
          git fetch origin
          git reset --hard origin/${{ github.ref_name }}
          git clean -fdx -e .env -e node_modules -e .next
          rm -rf .next/types

      - name: Install dependencies
        working-directory: /home/brownjeon/NFS/homes/brownjeon/project/StockInvest
        run: npm ci --no-audit --no-fund

      - name: Build (includes typecheck)
        working-directory: /home/brownjeon/NFS/homes/brownjeon/project/StockInvest
        run: npm run build

      - name: Reload PM2
        run: pm2 reload stockinvest --update-env

      - name: Health check
        run: |
          sleep 5
          curl -fsS http://127.0.0.1:3003/api/health || (pm2 logs stockinvest --lines 30 --nostream && exit 1)
