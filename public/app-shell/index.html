<!DOCTYPE html>
<!--
  T-084 — 안드로이드 앱 "주식캐기" 서버 연결 실패 화면 (Capacitor webDir + server.errorPath).
  승인 데모: mockups/T-084-app-shell-v1.html (v1, 2026-10-25 사용자 승인) "A. 서버 연결 실패 화면".
  운영 웹을 불러오지 못했을 때만 APK 안에서 뜬다. 외부 자원 0 — 인라인 CSS·JS·SVG 만(서버에 못 닿는 화면이라 링크 불가).
  색 토큰: src/app/globals.css 의 같은 이름 변수를 hex 로 복사 — 원본 globals.css sha256 앞 12자 04e7b5bc8394.
           globals.css 의 색을 바꾸면 이 값도 맞춘다(어긋남은 이 해시로 찾는다).
  [다시 시도] = 운영 주소로 location.replace, 약 8초 잠금. 다시 온라인이 되면(online 이벤트) 한 번만 자동 시도. 주기적 자동 재시도 없음.
  "매매는 안전합니다" 류 약속 금지 — 서버가 멈춘 경우일 수 있다("주문·승인은 서버에 연결된 뒤에만 할 수 있습니다"만).
  ⚠ 이 파일을 바꾸는 것은 네이티브 변경이다 — APK 재빌드 + versionCode 증가(android/app/build.gradle).
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="color-scheme" content="dark">
<title>주식캐기</title>
<style>
  :root {
    --bg: #0f1115;
    --bg2: #171a21;
    --bg3: #1f2430;
    --border: #262b36;
    --border2: #323848;
    --text: #e6e8ee;
    --muted: #8b93a7;
    --accent: #f59e0b;
    --warn: #f59e0b;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { max-width: 100vw; overflow-x: clip; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg); color: var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, "Noto Sans KR", sans-serif;
    font-size: 14px; -webkit-text-size-adjust: 100%;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  button:disabled { cursor: not-allowed; }
  :focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
  [hidden] { display: none !important; }
  @keyframes ti-spin { to { transform: rotate(360deg); } }

  .sh { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; text-align: center; background: var(--bg);
        padding: max(24px, var(--safe-top)) 24px max(24px, var(--safe-bottom)); }
  .sh .in { width: 100%; max-width: 320px; }
  .sh .logo { display: block; width: 72px; height: 72px; margin: 0 auto 10px; border-radius: 16px; overflow: hidden; }
  .sh .nm { margin: 0; font-size: 20px; font-weight: 700; color: var(--text); }
  .sh h1 { font-size: 17px; font-weight: 700; margin: 22px 0 6px; line-height: 1.4; }
  .sh p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.55; }
  .sh .stt { display: inline-flex; align-items: center; gap: 6px; margin-top: 14px; padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: 700; border: 1px solid var(--border2); color: var(--muted); }
  .sh .stt.warn { color: var(--warn); border-color: rgba(245,158,11,.45); }
  .sh .retry { margin-top: 20px; min-height: 48px; width: 200px; max-width: 100%; border-radius: 10px; background: var(--accent); color: #221a05; font-size: 15px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
  .sh .retry:disabled { opacity: .65; }
  .sh .hint { font-size: 12px; margin-top: 14px; }
  .sh .foot { font-size: 11px; margin-top: 22px; padding-top: 12px; border-top: 1px solid var(--border); }
  .spin { display: inline-block; width: 14px; height: 14px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: ti-spin .8s linear infinite; }
  @media (prefers-reduced-motion: reduce) { .spin { animation: none; border-right-color: currentColor; opacity: .6; } }
</style>
</head>
<body>
<main class="sh">
  <div class="in">
    <!-- ICON-SLOT: 앱 아이콘 ② "지층형 + 금덩이"(2026-10-25 사용자 확정, mockups/T-084-app-icon-v1.html 의 SRC.o2 배경+전경을 그대로 붙임).
         보이는 영역 72×72(viewBox 18 18 72 72)를 둥근 사각(반지름 16px — 시안 m-s 마스크와 같은 비율)으로 자른다. 자르기는 CSS border-radius
         (외부 자원·clipPath 참조 없이). 안드로이드 리소스 drawable/ic_launcher_{background,foreground}.xml 과 같은 도형이다 — 바꾸면 둘 다 바꾼다.
         곡괭이 시안(v1 A)은 쓰지 않는다. 이 화면을 바꾸는 것은 네이티브 변경이다. -->
    <svg class="logo" viewBox="18 18 72 72" aria-hidden="true" focusable="false">
      <rect width="108" height="108" fill="#171a21"/>
      <path d="M0 60 Q27 55 54 59 T108 57 V108 H0 Z" fill="#1f2430"/>
      <path d="M0 82 Q30 77 60 81 T108 79 V108 H0 Z" fill="#262b36"/>
      <polygon points="27,69.4 36,65.4 46,67.8 58,65.3 70,68.4 81,68.4 81,69.6 70,73.6 58,71.7 46,74.2 36,70.6 27,70.6" fill="#f59e0b"/>
      <rect x="34.8" y="48" width="2.4" height="14.5" rx="1.2" fill="#ef4444"/>
      <rect x="31.5" y="51" width="9" height="9" rx="1.5" fill="#ef4444"/>
      <rect x="46.8" y="37" width="2.4" height="27.5" rx="1.2" fill="#ef4444"/>
      <rect x="43.5" y="41" width="9" height="18" rx="1.5" fill="#ef4444"/>
      <rect x="58.8" y="27" width="2.4" height="36" rx="1.2" fill="#ef4444"/>
      <rect x="55.5" y="31" width="9" height="26" rx="1.5" fill="#ef4444"/>
      <polygon points="68,36 73,31.5 78.5,34.5 80,40.5 75,44.5 69,42" fill="#f59e0b"/>
      <path d="M69 42 L72.5 38 L80 40.5 M72.5 38 L73 31.5" fill="none" stroke="#171a21" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <p class="nm">주식캐기</p>
    <h1 id="t">인터넷에 연결되어 있지 않습니다</h1>
    <p id="d">와이파이나 모바일 데이터를 켠 뒤 다시 시도해 주세요. 연결되면 자동으로 한 번 다시 불러옵니다.</p>
    <div aria-live="polite" id="live"><span class="stt warn"><span aria-hidden="true">!</span>휴대폰 인터넷: 연결 안 됨</span></div>
    <div><button type="button" class="retry" id="retry">다시 시도</button></div>
    <p class="hint" id="hint" hidden>계속 안 되면 PC 브라우저로 stock.미라클펭귄.com 을 열어 보세요. PC 에서도 열리지 않으면 서버 문제입니다.</p>
    <p class="foot">이 화면은 앱 안에 들어 있는 안내 화면입니다. 주문·승인은 서버에 연결된 뒤에만 할 수 있습니다.</p>
  </div>
</main>
<script>
(function () {
  'use strict';
  // capacitor.config.ts 의 server.url 과 같은 값(퓨니코드). 바꾸면 둘 다 바꾼다.
  var APP_URL = 'https://stock.xn--lh0b87pnudm10a4vd.com/';
  var LOCK_MS = 8000;
  var busy = false;
  var autoTried = false;
  var unlockTimer = null;

  var el = {
    t: document.getElementById('t'),
    d: document.getElementById('d'),
    live: document.getElementById('live'),
    retry: document.getElementById('retry'),
    hint: document.getElementById('hint')
  };

  function isOnline() {
    return typeof navigator.onLine === 'boolean' ? navigator.onLine : true;
  }

  function clear(node) {
    while (node.firstChild) node.removeChild(node.firstChild);
  }

  function setStatus(cls, icon, spin, text) {
    var s = document.createElement('span');
    s.className = 'stt' + (cls ? ' ' + cls : '');
    var i = document.createElement('span');
    i.setAttribute('aria-hidden', 'true');
    if (spin) i.className = 'spin'; else i.textContent = icon;
    s.appendChild(i);
    s.appendChild(document.createTextNode(text));
    clear(el.live);
    el.live.appendChild(s);
  }

  function setButton(isBusy) {
    el.retry.disabled = isBusy;
    clear(el.retry);
    if (isBusy) {
      var sp = document.createElement('span');
      sp.className = 'spin';
      sp.setAttribute('aria-hidden', 'true');
      el.retry.appendChild(sp);
      el.retry.appendChild(document.createTextNode('연결 중…'));
    } else {
      el.retry.appendChild(document.createTextNode('다시 시도'));
    }
  }

  // 휴대폰 인터넷이 끊겼는지(navigator.onLine) / 서버가 응답하지 않는지만 나눠 말한다.
  function render() {
    if (!isOnline() && !busy) {
      el.t.textContent = '인터넷에 연결되어 있지 않습니다';
      el.d.textContent = '와이파이나 모바일 데이터를 켠 뒤 다시 시도해 주세요. 연결되면 자동으로 한 번 다시 불러옵니다.';
      setStatus('warn', '!', false, '휴대폰 인터넷: 연결 안 됨');
      el.hint.hidden = true;
    } else {
      el.t.textContent = '서버에 연결하지 못했습니다';
      el.d.textContent = '휴대폰 인터넷은 연결되어 있지만 서버가 응답하지 않습니다. 점검이나 재시작 중일 수 있습니다.';
      if (busy) setStatus('', '', true, '다시 불러오는 중…');
      else setStatus('', '✓', false, '휴대폰 인터넷: 연결됨');
      el.hint.hidden = false;
    }
    setButton(busy);
  }

  function retry() {
    if (busy) return;
    busy = true;
    render();
    clearTimeout(unlockTimer);
    // 실패하면 Capacitor 가 이 화면을 다시 띄운다. 그래도 이 화면이 남아 있으면 약 8초 뒤 버튼을 다시 연다.
    unlockTimer = setTimeout(function () { busy = false; render(); }, LOCK_MS);
    try { window.location.replace(APP_URL); } catch (e) { /* 다음 시도에 맡긴다 */ }
  }

  el.retry.addEventListener('click', retry);
  window.addEventListener('online', function () {
    render();
    if (!autoTried) { autoTried = true; retry(); }
  });
  window.addEventListener('offline', render);
  render();
})();
</script>
</body>
</html>
